function lineGraph(series,width=680,height=210){const flat=series.flatMap(s=>s.values.filter(Number.isFinite));if(!flat.length)return'<p class="muted">No data yet.</p>';let lo=Math.min(...flat),hi=Math.max(...flat);if(hi===lo){lo-=1;hi+=1}const pad=(hi-lo)*.1;lo-=pad;hi+=pad;const l=56,r=15,t=16,b=27;const n=Math.max(1,...series.map(s=>s.values.length));const X=i=>l+(n<=1?(width-l-r)/2:i*(width-l-r)/(n-1));const Y=v=>t+(height-t-b)*(1-(v-lo)/(hi-lo));let h='';for(let i=0;i<4;i++){const v=lo+(hi-lo)*i/3;h+=`<line x1="${l}" x2="${width-r}" y1="${Y(v)}" y2="${Y(v)}" stroke="#28466f" stroke-dasharray="4 5"/><text x="${l-5}" y="${Y(v)+4}" text-anchor="end" fill="#8faaca" font-size="11">${Math.round(v).toLocaleString('en-AU')}</text>`}series.forEach(s=>{const pts=s.values.map((v,i)=>`${X(i)},${Y(v)}`).join(' ');h+=`<polyline points="${pts}" fill="none" stroke="${s.col}" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"/>`;s.values.forEach((v,i)=>{if(i===s.values.length-1)h+=`<circle cx="${X(i)}" cy="${Y(v)}" r="4" fill="${s.col}"><title>${escapeHtml(s.label)}: ${fm(v)}</title></circle>`})});return`<svg class="line-graph" viewBox="0 0 ${width} ${height}" role="img" aria-label="${escapeHtml(series.map(s=>s.label).join(' and '))} over time">${h}</svg><div class="graph-legend">${series.map(s=>`<span><i style="background:${s.col}"></i>${escapeHtml(s.label)}</span>`).join('')}</div>`}

function refreshTrade(){const a=AS(S.ui.selected),sum=$('#tp-sum'),q=$('#qty');if(!a||!sum||!q)return;const t=findTeam(),p=assetPrice(S,a.id),h=t.hold[a.id],raw=Number(q.value),valid=Number.isSafeInteger(raw)&&raw>0&&raw<=100000,lock=tradeLock();

function v54Finance(t){const unreal=round(holdingsValue(S,t)-costBasis(t)),real=round(t.realised||0),investmentIncome=round((t.divPaid||0)+(t.accrued||0)),bankInterest=round(t.interestPaid||0);return {unreal,real,investmentIncome,bankInterest,financial:round(unreal+real+investmentIncome+bankInterest),wages:round(t.incomeReceived||0),superContrib:round(t.superContrib||0),superEarned:round(t.superEarned||0),superBalance:round(t.superBalance||0),netWorth:totalNet(S,t)}}

function v54Explain(t){const f=v54Finance(t),first=Object.keys(t.hold)[0],h=first?t.hold[first]:null,a=first?AS(first):null;return `<section class="panel"><h2>How financial returns are calculated</h2><p class="small muted">The figures use your actual holdings where possible. If no holding exists, an example is explicitly labelled as practice.</p>${h?`<details class="calc"><summary>View calculation: ${escapeHtml(a.name)} capital gain/loss</summary><p>${h.qty} units × ${fm(assetPrice(S,first))} current price = ${fm(h.qty*assetPrice(S,first))} market value.</p><p>${fm(h.qty*assetPrice(S,first))} − ${fm(h.cost)} remaining purchase cost = <strong>${pNum(round(h.qty*assetPrice(S,first)-h.cost))}</strong>.</p><p class="small muted">This is an unrealised gain/loss until the units are sold. This calculation uses your actual remaining cost basis.</p></details>`:`<details class="calc"><summary>View calculation: share gain (practice example)</summary><p>10 shares bought at $30 = $300 original cost. Now 10 × $36 = $360.</p><p>Capital gain = $360 − $300 = <strong>$60</strong>.</p></details>`}<details class="calc"><summary>View calculation: total financial gain/loss</summary><p>Realised gain/loss ${pNum(f.real)} + unrealised gain/loss ${pNum(f.unreal)} + dividends and coupons ${fm(f.investmentIncome)} + savings interest ${fm(f.bankInterest)} = <strong>${pNum(f.financial)}</strong>.</p><p class="small muted">The above excludes wages, quiz bonuses and employer superannuation contributions. Investment income already paid is not counted twice.</p></details><details class="calc"><summary>View calculation: dividend income (practice example)</summary><p>If 20 shares pay a $0.50 dividend each, income = 20 × $0.50 = <strong>$10</strong>.</p></details><details class="calc"><summary>View calculation: annual compound interest (practice example)</summary><p>$1,000 at 5% annual interest becomes $1,050 after one year and $1,102.50 after two years.</p><p>Interest earned = $1,102.50 − $1,000 = <strong>$102.50</strong>.</p><p class="small muted">In this simulation, annual rates are applied over three economic cycles. Your investigation may require monthly compounding instead.</p></details></section>`}

const GLOSS={interest:['Interest','Money you earn for lending your money (for example to a bank), or pay when you borrow.'],
compound:['Compound interest','Interest earned on your original money and on the interest you have already earned, so growth speeds up over time.'],
fixed:['Fixed interest rate','A rate locked in for a set period. It stays the same even if market interest rates change.'],
principal:['Principal','The original amount you deposit or invest, before any interest or gains.'],
maturity:['Maturity date','The day a fixed-term deposit ends and you get your money and interest back.'],
liquidity:['Liquidity','How quickly you can turn something into cash without losing value. Savings are very liquid; property is not.'],
etf:['ETF','Exchange-traded fund: one investment that holds many shares or bonds, so you own a small slice of lots of assets.'],
diversification:['Diversification','Spreading your money across different investments so one bad result hurts less.'],
shareholder:['Shareholder','A part-owner of a company. You own shares and may receive a share of its profits.'],
growth:['Capital growth','An increase in an investment’s price above what you paid for it.'],
loss:['Capital loss','When an investment’s price falls below what you paid. It becomes a realised loss only if you sell.'],
dividend:['Dividend','A share of a company’s profit paid to its shareholders, usually in cash.'],
yield:['Yield','The income an investment pays each year (such as interest or dividends) as a percentage of its price.'],
volatility:['Volatility','How much and how quickly a price moves up and down. High volatility means bigger swings.'],
risktol:['Risk tolerance','How much ups and downs in your investments you can handle, both financially and emotionally.'],
commodity:['Commodity','A raw material that is bought and sold, such as gold, copper or oil.'],
super:['Superannuation','Australia’s retirement savings system. Money is set aside while you work and is locked away until you retire.'],
horizon:['Time horizon','How long until you need the money. Longer horizons can usually handle more risk.']};
const GALIAS=[['compound interest','compound'],['fixed interest rate','fixed'],['fixed rate','fixed'],['maturity date','maturity'],['capital growth','growth'],['capital gains','growth'],['capital gain','growth'],['capital losses','loss'],['capital loss','loss'],['risk tolerance','risktol'],['superannuation','super'],['diversification','diversification'],['diversified','diversification'],['shareholders','shareholder'],['shareholder','shareholder'],['dividends','dividend'],['dividend','dividend'],['volatility','volatility'],['volatile','volatility'],['liquidity','liquidity'],['principal','principal'],['commodities','commodity'],['commodity','commodity'],['interest','interest'],['yield','yield'],['ETFs','etf'],['ETF','etf'],['time horizon','horizon']].sort((a,b)=>b[0].length-a[0].length);
const GRE=new RegExp('\\b('+GALIAS.map(a=>a[0]).join('|')+')\\b','gi'),GMAP=Object.fromEntries(GALIAS.map(a=>[a[0].toLowerCase(),a[1]]));
function ag(text){const seen={};return escapeHtml(text).replace(GRE,m=>{const k=GMAP[m.toLowerCase()];if(!k||seen[k])return m;seen[k]=1;return`<button type="button" class="term" data-term="${k}" aria-expanded="false">${m}</button>`})}
const gp={btn:null,pinned:false};
function dedupeTerms(root){if(!root)return;const seen=new Set();root.querySelectorAll('.term').forEach(b=>{if(!b.getClientRects().length)return;const key=b.dataset.term;if(seen.has(key))b.replaceWith(document.createTextNode(b.textContent));else seen.add(key)})}
function glossEl(){let e=document.getElementById('gloss-pop');if(!e){e=document.createElement('div');e.id='gloss-pop';e.setAttribute('role','tooltip');e.hidden=true;document.body.appendChild(e)}return e}
function showGloss(b,pin){const g=GLOSS[b.dataset.term];if(!g)return;if(gp.btn&&gp.btn!==b)gp.btn.setAttribute('aria-expanded','false');const e=glossEl();e.innerHTML=`<b>${escapeHtml(g[0])}</b><br>${escapeHtml(g[1])}`;e.hidden=false;const r=b.getBoundingClientRect(),w=e.offsetWidth,h=e.offsetHeight;let x=Math.max(8,Math.min(r.left,innerWidth-w-8)),y=r.bottom+6;if(y+h>innerHeight-8)y=Math.max(8,r.top-h-6);e.style.left=x+'px';e.style.top=y+'px';b.setAttribute('aria-describedby','gloss-pop');b.setAttribute('aria-expanded','true');gp.btn=b;gp.pinned=!!pin}
function hideGloss(force){if(!force&&gp.pinned)return;const e=document.getElementById('gloss-pop');if(e)e.hidden=true;if(gp.btn){gp.btn.removeAttribute('aria-describedby');gp.btn.setAttribute('aria-expanded','false')}gp.btn=null;gp.pinned=false}
const termOf=e=>e.target&&e.target.closest?e.target.closest('.term'):null;
document.addEventListener('mouseover',e=>{const b=termOf(e);if(b&&!gp.pinned)showGloss(b,false)});
document.addEventListener('mouseout',e=>{if(termOf(e)&&!gp.pinned)hideGloss(true)});
document.addEventListener('focusin',e=>{const b=termOf(e);if(b&&!gp.pinned)showGloss(b,false)});
document.addEventListener('focusout',e=>{if(termOf(e)&&!gp.pinned)hideGloss(true)});
document.addEventListener('click',e=>{const b=termOf(e);if(b){e.preventDefault();if(gp.pinned&&gp.btn===b)hideGloss(true);else showGloss(b,true);return}if(!e.target.closest('#gloss-pop'))hideGloss(true)});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&gp.btn)hideGloss(true)});

 return''}

 dismissNews(){if(S.phase!=='news'){S.ui.newsReopen=false;render();return;}const elapsed=Date.now()-(S.readStartedAt||Date.now());if(elapsed<READ_DELAY_MS){toast('Take a moment to read the news first.',true);return;}S.ui.newsSeen[`${findTeam().id}:${S.cycle}`]=true;S.ui.newsReopen=false;S.newsHold=false;const r=openTrading(S);respond(r)},
 reopenNews(){if(!S.beat||['lobby','ended'].includes(S.phase))return;S.ui.newsReopen=true;render()},
 finishTrading(){if(S.phase!=='trading')return;const elapsed=Date.now()-(S.tradeStartedAt||Date.now());if(elapsed<MIN_TRADE_MS){toast('Please review the market briefly before finishing.',true);return;}if(!confirm('Finish trading? Prices will settle and you will not be able to make more trades this cycle.'))return;respond(closeAndSettle(S))},
 showResults(){if(S.phase!=='review')return;S.ui.resultSeen[`${findTeam().id}:${S.cycle}`]=false;render()},
 nextCycle(){if(S.phase!=='review')return;const elapsed=Date.now()-(S.reviewStartedAt||Date.now());if(elapsed<REVIEW_DELAY_MS&&!(cycleNow(S)===3&&V54_Q[yearsNow(S)]&&v55ReviewValid(S))){toast('Take a moment to review your results.',true);return;}if(!v55ReviewValid(S)){toast('Submit both reflections before continuing.',true);this.showResults();return;}if(PART===1&&S.cycle>=14){toast('Part 1 is finished. Download your save for Part 2.',true);return;}const r=completeReview(S);if(r.ok){S.ui.studentTab=r&&S.phase==='ended'?'performance':'invest'}respond(r)},
 saveCheckpoint(y){if(S.phase!=='review'||cycleNow(S)!==3||yearsNow(S)!==y||![2,5,10].includes(y))return;const q=V54_Q[y],vals=q.map((_,i)=>document.getElementById(`checkpoint-${i}`)?.value.trim()||'');if(vals.some(x=>x.length<18||x.split(/\s+/).length<4)){toast('Write at least a short explanation (four words and 18 characters) for each question.',true);return;}const t=findTeam();t.reflections=t.reflections||{};t.reflections[y]=vals;S.ui.studentTab='performance';S.ui.resultSeen[`${t.id}:${S.cycle}`]=true;render();toast('Both reflections submitted. '+(PART===1&&y===5?'Part 1 complete. Save your file.':'Continue when ready.'))},
 saveReflection(y){const q=V54_Q[y];if(!q||yearsNow(S)<y||!Array.isArray(findTeam().reflections?.[y])){toast('Complete the reflection at the Year '+y+' checkpoint first.',true);return;}const vals=q.map((_,i)=>document.getElementById(`reflect-${y}-${i}`)?.value.trim()||'');if(vals.some(x=>x.length<18||x.split(/\s+/).length<4)){toast('Complete both reflections before saving.',true);return;}findTeam().reflections[y]=vals;render();toast('Reflections saved.')},
 practiceAnswer(i){const t=findTeam(),ready=(PART===1&&v55PartOneFinished(S))||(PART===2&&S.fromPart1);if(!ready)return;const q=PRACTICE[(t.practiceCount||0)%PRACTICE.length];t.practiceFeedback=(i===q.correct?'Correct. ':'Not quite. ')+q.why;render()},
 practiceNext(){const t=findTeam();if(!t.practiceFeedback)return;t.practiceCount=(t.practiceCount||0)+1;t.practiceFeedback='';render()}
};

function boot(){try{const raw=JSON.parse(localStorage.getItem(STORE)||localStorage.getItem(PRIOR_STORE)||'null');if(raw&&[57,58].includes(raw.version)&&raw.part===PART&&raw.ui&&raw.teams?.length===1&&raw.prices&&raw.clock){S=migrateUI(raw);S.version=GAME_VERSION;S.ui.view='home';S.ui.studentTab='invest';S.botsEnabled=false;S.clock.startedAt=null;S.paused=false;if(S.phase==='news'){S.newsHold=true;S.readStartedAt=Date.now();S.ui.newsSeen={};}if(S.phase==='trading'){S.clock.remaining=tradingSeconds(S)*1000;S.tradeStartedAt=Date.now();}if(S.phase==='review')S.reviewStartedAt=Date.now();}}catch(e){}if(!S)S=newGame({names:[['Student','']],botsEnabled:false});$('#import-file').addEventListener('change',ev=>importSave(ev.target.files[0]));render();window.addEventListener('resize',setHeights);setInterval(()=>{if(advanceTime(S)){render()}else updateClock();v55RefreshDelays()},250);setInterval(()=>{if(S&&['news','trading','review'].includes(S.phase))save()},5000)}
function v55RefreshDelays(){const finish=$('#finish-trading');if(finish&&S.phase==='trading'){const wait=Math.max(0,Math.ceil((MIN_TRADE_MS-(Date.now()-(S.tradeStartedAt||Date.now())))/1000));finish.disabled=wait>0;finish.textContent=wait?'Finish available in '+wait+'s':'Finished Trading'}const n=$('#news-continue');if(n&&S.phase==='news'){const remain=Math.max(0,Math.ceil((READ_DELAY_MS-(Date.now()-(S.readStartedAt||Date.now())))/1000));n.disabled=remain>0;n.textContent=remain?'Read the news · '+remain+'s':'Continue to trading'}const r=$('#result-next');if(r&&S.phase==='review'){const remain=Math.max(0,Math.ceil((REVIEW_DELAY_MS-(Date.now()-(S.reviewStartedAt||Date.now())))/1000));r.disabled=remain>0;r.textContent=remain?'Review results · '+remain+'s':'Continue to next cycle'}const b=$('#banner-next');if(b&&S.phase==='review'){const remain=Math.max(0,Math.ceil((REVIEW_DELAY_MS-(Date.now()-(S.reviewStartedAt||Date.now())))/1000));b.disabled=remain>0;b.textContent=remain?'Continue in '+remain+'s':yearsNow(S)===10?'View final report':'Next cycle'}}

document.addEventListener('DOMContentLoaded',boot);
</script></body></html>
