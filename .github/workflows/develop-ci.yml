name: Validate development game
on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  regression:
    name: Regression and browser checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check embedded scripts and market behaviour
        run: node --test tests/regression.test.cjs
      - name: Install Chromium test runner
        run: npm install --no-save @playwright/test@1.55.0
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Start local game server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/risk-reward-server.log 2>&1 &
          for i in $(seq 1 20); do
            if curl --silent --fail http://127.0.0.1:4173/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/risk-reward-server.log
          exit 1
      - name: Test game in Chromium
        run: npx playwright test tests/browser.spec.cjs --reporter=line --workers=1

