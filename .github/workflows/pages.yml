name: Publish Risk & Reward website

on:
  push:
    branches: [main]
  workflow_run:
    workflows: ["Validate development game"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: risk-and-reward-github-pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy live site and tested development preview
    runs-on: ubuntu-24.04
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'develop')
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out live production files
        uses: actions/checkout@v4
        with:
          ref: main
          path: production

      - name: Check out development version
        uses: actions/checkout@v4
        with:
          ref: develop
          path: development

      - name: Ignore obsolete development runs
        id: fresh
        env:
          EVENT_TYPE: ${{ github.event_name }}
          VALIDATED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [[ "$EVENT_TYPE" == "workflow_run" ]] && [[ "$VALIDATED_SHA" != "$(git -C development rev-parse HEAD)" ]]; then
            echo "A newer development commit exists; skipping old deployment."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare website without changing repository files
        if: steps.fresh.outputs.publish == 'true'
        run: |
          mkdir -p site
          rsync -a --exclude='.git/' --exclude='.github/' \
            --exclude='tests/' --exclude='.gitignore' \
            production/ site/
          mkdir -p site/preview/develop
          cp development/index.html site/preview/develop/index.html
          touch site/.nojekyll
          test -s site/index.html
          test -s site/preview/develop/index.html
          cmp site/preview/develop/index.html development/index.html

      - name: Configure GitHub Pages
        if: steps.fresh.outputs.publish == 'true'
        uses: actions/configure-pages@v5

      - name: Upload the complete website
        if: steps.fresh.outputs.publish == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        if: steps.fresh.outputs.publish == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
