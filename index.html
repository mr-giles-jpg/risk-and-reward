function lineGraph(series,width=680,height=210){const flat=series.flatMap(s=>s.values.filter(Number.isFinite));if(!flat.length)return'<p class="muted">No data yet.</p>';let lo=Math.min(...flat),hi=Math.max(...flat);if(hi===lo){lo-=1;hi+=1}const pad=(hi-lo)*.1;lo-=pad;hi+=pad;const l=56,r=15,t=16,b=27;const n=Math.max(1,...series.map(s=>s.values.length));const X=i=>l+(n<=1?(width-l-r)/2:i*(width-l-r)/(n-1));const Y=v=>t+(height-t-b)*(1-(v-lo)/(hi-lo));let h='';for(let i=0;i<4;i++){const v=lo+(hi-lo)*i/3;h+=`<line x1="${l}" x2="${width-r}" y1="${Y(v)}" y2="${Y(v)}" stroke="#28466f" stroke-dasharray="4 5"/><text x="${l-5}" y="${Y(v)+4}" text-anchor="end" fill="#8faaca" font-size="11">${Math.round(v).toLocaleString('en-AU')}</text>`}series.forEach(s=>{const pts=s.values.map((v,i)=>`${X(i)},${Y(v)}`).join(' ');h+=`<polyline points="${pts}" fill="none" stroke="${s.col}" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"/>`;s.values.forEach((v,i)=>{if(i===s.values.length-1)h+=`<circle cx="${X(i)}" cy="${Y(v)}" r="4" fill="${s.col}"><title>${escapeHtml(s.label)}: ${fm(v)}</title></circle>`})});return`<svg class="line-graph" viewBox="0 0 ${width} ${height}" role="img" aria-label="${escapeHtml(series.map(s=>s.label).join(' and '))} over time">${h}</svg><div class="graph-legend">${series.map(s=>`<span><i style="background:${s.col}"></i>${escapeHtml(s.label)}</span>`).join('')}</div>`}

function refreshTrade(){const a=AS(S.ui.selected),sum=$('#tp-sum'),q=$('#qty');if(!a||!sum||!q)return;const t=findTeam(),p=assetPrice(S,a.id),h=t.hold[a.id],raw=Number(q.value),valid=Number.isSafeInteger(raw)&&raw>0&&raw<=100000,lock=tradeLock();

function v54Finance(t){const unreal=round(holdingsValue(S,t)-costBasis(t)),real=round(t.realised||0),investmentIncome=round((t.divPaid||0)+(t.accrued||0)),bankInterest=round(t.interestPaid||0);return {unreal,real,investmentIncome,bankInterest,financial:round(unreal+real+investmentIncome+bankInterest),wages:round(t.incomeReceived||0),superContrib:round(t.superContrib||0),superEarned:round(t.superEarned||0),superBalance:round(t.superBalance||0),netWorth:totalNet(S,t)}}

function v54Explain(t){const f=v54Finance(t),first=Object.keys(t.hold)[0],h=first?t.hold[first]:null,a=first?AS(first):null;return `<section class="panel"><h2>How financial returns are calculated</h2><p class="small muted">The figures use your actual holdings where possible. If no holding exists, an example is explicitly labelled as practice.</p>${h?`<details class="calc"><summary>View calculation: ${escapeHtml(a.name)} capital gain/loss</summary><p>${h.qty} units × ${fm(assetPrice(S,first))} current price = ${fm(h.qty*assetPrice(S,first))} market value.</p><p>${fm(h.qty*assetPrice(S,first))} − ${fm(h.cost)} remaining purchase cost = <strong>${pNum(round(h.qty*assetPrice(S,first)-h.cost))}</strong>.</p><p class="small muted">This is an unrealised gain/loss until the units are sold. This calculation uses your actual remaining cost basis.</p></details>`:`<details class="calc"><summary>View calculation: share gain (practice example)</summary><p>10 shares bought at $30 = $300 original cost. Now 10 × $36 = $360.</p><p>Capital gain = $360 − $300 = <strong>$60</strong>.</p></details>`}<details class="calc"><summary>View calculation: total financial gain/loss</summary><p>Realised gain/loss ${pNum(f.real)} + unrealised gain/loss ${pNum(f.unreal)} + dividends and coupons ${fm(f.investmentIncome)} + savings interest ${fm(f.bankInterest)} = <strong>${pNum(f.financial)}</strong>.</p><p class="small muted">The above excludes wages, quiz bonuses and employer superannuation contributions. Investment income already paid is not counted twice.</p></details><details class="calc"><summary>View calculation: dividend income (practice example)</summary><p>If 20 shares pay a $0.50 dividend each, income = 20 × $0.50 = <strong>$10</strong>.</p></details><details class="calc"><summary>View calculation: annual compound interest (practice example)</summary><p>$1,000 at 5% annual interest becomes $1,050 after one year and $1,102.50 after two years.</p><p>Interest earned = $1,102.50 − $1,000 = <strong>$102.50</strong>.</p><p class="small muted">In this simulation, annual rates are applied over three economic cycles. Your investigation may require monthly compounding instead.</p></details></section>`}

const GLOSS={interest:['Interest','Money you earn for lending your money (for example to a bank), or pay when you borrow.'],
compound:['Compound interest','Interest earned on your original money and on the interest you have already earned, so growth speeds up over time.'],
fixed:['Fixed interest rate','A rate locked in for a set period. It stays the same even if market interest rates change.'],
principal:['Principal','The original amount you deposit or invest, before any interest or gains.'],
maturity:['Maturity date','The day a fixed-term deposit ends and you get your money and interest back.'],
liquidity:['Liquidity','How quickly you can turn something into cash without losing value. Savings are very liquid; property is not.'],
etf:['ETF','Exchange-traded fund: one investment that holds many shares or bonds, so you own a small slice of lots of assets.'],
diversification:['Diversification','Spreading your money across different investments so one bad result hurts less.'],
shareholder:['Shareholder','A part-owner of a company. You own shares and may receive a share of its profits.'],
growth:['Capital growth','An increase in an investment’s price above what you paid for it.'],
loss:['Capital loss','When an investment’s price falls below what you paid. It becomes a realised loss only if you sell.'],
dividend:['Dividend','A share of a company’s profit paid to its shareholders, usually in cash.'],
yield:['Yield','The income an investment pays each year (such as interest or dividends) as a percentage of its price.'],
volatility:['Volatility','How much and how quickly a price moves up and down. High volatility means bigger swings.'],
risktol:['Risk tolerance','How much ups and downs in your investments you can handle, both financially and emotionally.'],
commodity:['Commodity','A raw material that is bought and sold, such as gold, copper or oil.'],
super:['Superannuation','Australia’s retirement savings system. Money is set aside while you work and is locked away until you retire.'],
horizon:['Time horizon','How long until you need the money. Longer horizons can usually handle more risk.']};
const GALIAS=[['compound interest','compound'],['fixed interest rate','fixed'],['fixed rate','fixed'],['maturity date','maturity'],['capital growth','growth'],['capital gains','growth'],['capital gain','growth'],['capital losses','loss'],['capital loss','loss'],['risk tolerance','risktol'],['superannuation','super'],['diversification','diversification'],['diversified','diversification'],['shareholders','shareholder'],['shareholder','shareholder'],['dividends','dividend'],['dividend','dividend'],['volatility','volatility'],['volatile','volatility'],['liquidity','liquidity'],['principal','principal'],['commodities','commodity'],['commodity','commodity'],['interest','interest'],['yield','yield'],['ETFs','etf'],['ETF','etf'],['time horizon','horizon']].sort((a,b)=>b[0].length-a[0].length);
const GRE=new RegExp('\\b('+GALIAS.map(a=>a[0]).join('|')+')\\b','gi'),GMAP=Object.fromEntries(GALIAS.map(a=>[a[0].toLowerCase(),a[1]]));
function ag(text){const seen={};return escapeHtml(text).replace(GRE,m=>{const k=GMAP[m.toLowerCase()];if(!k||seen[k])return m;seen[k]=1;return`<button type="button" class="term" data-term="${k}" aria-expanded="false">${m}</button>`})}
const gp={btn:null,pinned:false};
function dedupeTerms(root){if(!root)return;const seen=new Set();root.querySelectorAll('.term').forEach(b=>{if(!b.getClientRects().length)return;const key=b.dataset.term;if(seen.has(key))b.replaceWith(document.createTextNode(b.textContent));else seen.add(key)})}
function glossEl(){let e=document.getElementById('gloss-pop');if(!e){e=document.createElement('div');e.id='gloss-pop';e.setAttribute('role','tooltip');e.hidden=true;document.body.appendChild(e)}return e}
function showGloss(b,pin){const g=GLOSS[b.dataset.term];if(!g)return;if(gp.btn&&gp.btn!==b)gp.btn.setAttribute('aria-expanded','false');const e=glossEl();e.innerHTML=`<b>${escapeHtml(g[0])}</b><br>${escapeHtml(g[1])}`;e.hidden=false;const r=b.getBoundingClientRect(),w=e.offsetWidth,h=e.offsetHeight;let x=Math.max(8,Math.min(r.left,innerWidth-w-8)),y=r.bottom+6;if(y+h>innerHeight-8)y=Math.max(8,r.top-h-6);e.style.left=x+'px';e.style.top=y+'px';b.setAttribute('aria-describedby','gloss-pop');b.setAttribute('aria-expanded','true');gp.btn=b;gp.pinned=!!pin}
function hideGloss(force){if(!force&&gp.pinned)return;const e=document.getElementById('gloss-pop');if(e)e.hidden=true;if(gp.btn){gp.btn.removeAttribute('aria-describedby');gp.btn.setAttribute('aria-expanded','false')}gp.btn=null;gp.pinned=false}
const termOf=e=>e.target&&e.target.closest?e.target.closest('.term'):null;
document.addEventListener('mouseover',e=>{const b=termOf(e);if(b&&!gp.pinned)showGloss(b,false)});
document.addEventListener('mouseout',e=>{if(termOf(e)&&!gp.pinned)hideGloss(true)});
document.addEventListener('focusin',e=>{const b=termOf(e);if(b&&!gp.pinned)showGloss(b,false)});
document.addEventListener('focusout',e=>{if(termOf(e)&&!gp.pinned)hideGloss(true)});
document.addEventListener('click',e=>{const b=termOf(e);if(b){e.preventDefault();if(gp.pinned&&gp.btn===b)hideGloss(true);else showGloss(b,true);return}if(!e.target.closest('#gloss-pop'))hideGloss(true)});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&gp.btn)hideGloss(true)});

 return''}

priceForNews=function(state,beat){const moves={};state.v6Factors=state.v6Factors||{};const factors=state.v6Factors[state.cycle]||{};A.forEach(a=>{const effect=newsImpact(a,beat),old=state.prices[a.id].at(-1),newP=round(Math.max(.5,old*Math.exp(.30*effect)));state.prices[a.id].push(newP);moves[a.id]=round(100*(newP/old-1));factors[a.id]={news:effect*100,pre:.30*effect*100,post:.70*effect*100,random:0}});state.v6Factors[state.cycle]=factors;return moves};

<script id="v61-ui-patch-script">
(()=>{
  const ICONS={BOND:'🏛️',AUS:'📊',GLOBAL:'🌏',PROP:'🏘️',TECHETF:'💻',RESETF:'⛏️',SHOP:'🛒',MINE:'⛏️',TECH:'💻',ENERGY:'⚡',ORBIT:'🛰️',HEALTH:'🩺',RENEW:'☀️',GOLD:'🥇',COPPER:'🔩',OIL:'🛢️'};
  const origResultsOverlay = typeof resultsOverlay==='function' ? resultsOverlay : null;
  const origIntroBody = typeof introBody==='function' ? introBody : null;
  const origSavings = typeof savings==='function' ? savings : null;
  function incomeText(a){
    if((a.yield||0)<=0) return 'Income: none';
    if(a.id==='BOND') return `Income: ${a.yield}% coupon p.a.`;
    if(a.id==='PROP') return `Income: ${a.yield}% distribution p.a.`;
    if(a.group==='funds') return `Income: ${a.yield}% yield p.a.`;
    return `Income: ${a.yield}% dividend p.a.`;
  }
  function returnText(a){ return `Return target: ${a.mu}% p.a.`; }
  function shortName(a){ return escapeHtml(a.short||a.name); }
  renderTile=function(id){
    const a=AS(id), price=assetPrice(S,id), change=priceDelta(S,id), h=findTeam().hold[id], name=shortName(a), ticker=escapeHtml(a.ticker||id);
    const income=(a.group==='commodities') ? 'Income: none' : incomeText(a);
    const held=h?`${h.qty} held`:'Not held';
    return `<article class="tile rr61-tile ${S.ui.selected===id?'sel':''}" data-asset="${id}" style="--asset:${a.col}"><button type="button" class="tile-main" id="tile-${id}" aria-label="Select ${name}; price ${fm(price)}; risk ${escapeHtml(a.risk)}" onclick="UI.pick('${id}')"><span class="rr61-card-head"><span class="rr61-title-block"><span class="rr61-card-title"><span class="rr61-ticker">${ticker}</span><span class="rr61-name">${name}</span></span><span class="tile-risk ${riskColour(a.risk)}">Risk: ${escapeHtml(a.risk)}</span></span><span class="rr61-card-right"><strong class="rr61-price">${fm(price)}</strong><span class="rr61-change ${change>=0?'positive':'negative'}">${fmtPct(change)}</span></span></span><span class="rr61-card-foot"><span class="rr61-income">${income}</span><span class="rr61-held">${held}</span></span></button></article>`;
  };
  newsStrip=function(){
    if(!S.beat||S.phase==='lobby'||S.phase==='ended') return '';
    const b=S.beat;
    return `<button type="button" class="news-strip news-strip-link" aria-label="Open current news" onclick="UI.reopenNews()"><span class="news-tag">NEWS</span><span class="news-text" title="${escapeHtml(b.title+'. '+b.text)}"><b>Y${b.year} C${b.act} · ${escapeHtml(b.title)}</b> <span>${escapeHtml(b.text)}</span></span></button>`;
  };
  phaseBanner=function(){
    if(S.phase==='trading') return '';
    if(S.phase==='review'){
      const y=yearsNow(S), reflection=cycleNow(S)===3&&[2,5,10].includes(y), done=v55ReviewValid(S);
      return `<div class="banner blue"><span>${y===5&&reflection?'Year 5 halfway checkpoint':reflection&&!done?'Your Year '+y+' reflection is required':'Review the cycle results before continuing'}</span>${reflection&&!done?'<button class="btn v61-yellow-btn smallbtn" onclick="UI.toReflection()">Go to reflection</button>':`<button class="btn v61-yellow-btn smallbtn" id="banner-next" onclick="UI.nextCycle()">${y===10?'Complete game':'Next cycle'}</button>`}</div>`;
    }
    return '';
  };
  if(origResultsOverlay){
    resultsOverlay=function(t){
      let out=origResultsOverlay(t);
      out=out.replace(/<p class="v6-annual-flag">End of year: use Performance to record your net worth, news and decisions\.<\/p>/g,'');
      return out;
    };
  }
  function cardForAsset(id){
    const a=AS(id), icon=ICONS[id]||'📈';
    return `<div class="v61-intro-card" style="--asset:${a.col}"><b>${icon} ${escapeHtml(a.ticker)} · ${shortName(a)}</b><div class="v61-intro-sub">Risk: ${escapeHtml(a.risk)}</div><div class="v61-intro-meta">${returnText(a)} · ${incomeText(a)}</div></div>`;
  }
  if(origIntroBody){
    introBody=function(id){
      if(id==='prop-gold') return `<div class="v61-intro-grid">${cardForAsset('PROP')}${cardForAsset('GOLD')}</div><p class="v61-intro-note">Property funds can provide income but react to rates and rents. Gold pays no income and may move differently from shares.</p>`;
      if(id==='shares') return `<div class="v61-intro-grid">${['SHOP','MINE','TECH','ENERGY'].map(cardForAsset).join('')}</div><p class="v61-intro-note">These are individual companies, so prices can react strongly to company-specific results.</p>`;
      if(id==='new-sectors') return `<div class="v61-intro-grid">${['ORBIT','HEALTH'].map(cardForAsset).join('')}</div><p class="v61-intro-note">Compare technology demand and competition with the steadier but regulated health-care sector.</p>`;
      if(id==='intl') return `<div class="v61-intro-grid">${['GLOBAL','TECHETF'].map(cardForAsset).join('')}</div><p class="v61-intro-note">An ETF spreads your money across multiple companies, but international and sector-specific risks still remain.</p>`;
      if(id==='energy-new') return `<div class="v61-intro-grid">${['RESETF','RENEW'].map(cardForAsset).join('')}</div><p class="v61-intro-note">Compare a diversified resources-and-energy ETF with a single renewables company.</p>`;
      if(id==='commod') return `<div class="v61-intro-grid">${['COPPER','OIL'].map(cardForAsset).join('')}</div><p class="v61-intro-note">Commodity funds in this game do not pay income. Their returns depend on price movements.</p>`;
      return origIntroBody(id);
    };
  }
  groupGuide=function(g){
    const make=(icon,title,body)=>`<div class="v61-guide-item"><b>${icon} ${title}</b><p>${body}</p></div>`;
    let heading='How do investments work?', intro='', cards='';
    if(g==='banking'){
      heading='How do savings and deposits work?';
      intro='These are lower-risk cash products. They focus on interest and access to money rather than large price movements.';
      cards=[
        make('💰','Savings account','Earns interest and stays easy to access during trading.'),
        make('🔒','Fixed-term deposit','Offers a fixed interest rate, but your money is locked until maturity.'),
        make('⚖️','Main trade-off','Lower risk and more predictability usually mean lower long-term growth than shares.')
      ].join('');
    } else if(g==='funds'){
      heading='How do funds and bonds work?';
      intro='These investments pool money or lend to governments. They can spread risk across many holdings, but they can still rise and fall.';
      cards=[
        make('🏛️','Government bonds','Can pay coupon income. Bond prices often react to interest-rate changes.'),
        make('📊','ETFs','Exchange-traded funds hold many investments at once, which spreads company-specific risk.'),
        make('🏘️','Property fund','A fund can provide income and price growth, but it remains sensitive to the economy and borrowing costs.')
      ].join('');
    } else if(g==='shares'){
      heading='How do company shares work?';
      intro='A shareholder owns part of a company. Returns can come from rising prices and dividends, but individual companies can be volatile.';
      cards=[
        make('🏢','Ownership','Buying shares means owning a small part of a business.'),
        make('📈','Potential reward','If the company performs well, its share price may rise and it may pay dividends.'),
        make('⚠️','Main risk','One company can fall sharply if profits, costs or expectations change.')
      ].join('');
    } else {
      heading='How do commodity investments work?';
      intro='Commodity investments track raw materials such as metals or energy products. Their prices often respond to supply, demand and global events.';
      cards=[
        make('🛢️','What moves them?','Commodity prices change when production, transport, weather, demand or global conflict shifts.'),
        make('🔄','Different behaviour','They may move differently from company shares, which can help diversify a portfolio.'),
        make('🚫','Income','Commodity funds in this game do not pay investment income. Returns come from price changes only.')
      ].join('');
    }
    return `<details class="panel compact group-guide v61-simple-guide"><summary>${heading}</summary><p class="v61-guide-intro">${intro}</p><div class="v61-guide-grid">${cards}</div></details>`;
  };
  if(origSavings){
    savings=function(t){
      const wrap=document.createElement('div');
      wrap.innerHTML=origSavings(t);
      const s=wrap.querySelector('.savings');
      if(!s) return wrap.innerHTML;
      const right=s.querySelector('.savings-grid > div:nth-child(2)');
      if(right){
        const choices=right.querySelector('.deposit-choices');
        if(choices){
          const grid=document.createElement('div');
          grid.className='v61-term-grid';
          [...choices.querySelectorAll('.deposit-option')].forEach(opt=>{
            opt.classList.add('v61-term-card');

            if(btn){btn.classList.remove('subtle');btn.classList.add('success');btn.textContent='Open';}
            grid.appendChild(opt);
          });
          choices.replaceWith(grid);
        }
      }
      const term=s.querySelector('#term-amount');
      if(term){
        const extras=term.nextElementSibling;
        const html='<div class="v6-bank-extras"><button class="btn subtle" onclick="UI.termAdd(100)">+ $100</button><button class="btn subtle" onclick="UI.termAdd(-100)">− $100</button><button class="btn subtle" onclick="UI.termMax()">Max cash for deposit</button></div>';
        if(extras && extras.classList.contains('v6-bank-extras')) extras.outerHTML=html; else term.insertAdjacentHTML('afterend', html);
      }
      return wrap.innerHTML;
    };
    UI.termAdd=function(n){const e=document.getElementById('term-amount');if(!e)return;e.value=round(Math.max(100,(Number(e.value)||0)+n));};
  }
  // Force a consistent rerender with patched components.
  // Initial rendering is handled by the game's boot sequence.
})();
</script>

<script id="rr61-final-review-script">
(()=>{

    let markup=originalHeader();

      held=t.hold[id],pnl=held?round(held.qty*p-held.cost):0,
      income=a.yield>0?`${a.id==='BOND'?'Coupon':a.id==='PROP'?'Distribution':a.group==='funds'?'Income yield':'Dividend'}: ${a.yield}% p.a.`:'No investment income';
    return `<article class="tile rr61-tile ${S.ui.selected===id?'sel':''}" data-asset="${id}" style="--asset:${a.col}"><button type="button" class="tile-main" id="tile-${id}" aria-pressed="${S.ui.selected===id}" aria-label="Select ${escapeHtml(a.name)}; current price ${fm(p)}" onclick="UI.pick('${id}')"><span class="rr61-card-head"><span class="rr61-title-block"><span class="rr61-card-title"><span class="rr61-ticker">${escapeHtml(a.ticker)}</span><span class="rr61-name">${escapeHtml(a.short||a.name)}</span></span><span class="tile-risk ${riskColour(a.risk)}">Risk: ${escapeHtml(a.risk==='Medium–High'?'Med-High':a.risk)}</span></span><span class="rr61-card-right"><strong class="rr61-price">${fm(p)}</strong><span class="rr61-change ${delta>=0?'positive':'negative'}">${fmtPct(delta)}</span></span></span><span class="rr61-card-foot"><span class="rr61-income">${escapeHtml(income)}</span><span class="rr61-held">${held?`Held: ${held.qty} · ${pNum(pnl)}`:'Not held'}</span></span></button></article>`;
  };
  const originalInvest=invest;
  invest=function(t){
    const result=originalInvest(t);
    if(curGroup()==='banking')return result;
    const container=document.createElement('div');container.innerHTML=result;
    const selected=AS(S.ui.selected);
    if(selected){
      for(const el of container.querySelectorAll('.v6-chart-column,.v6-trade-panel')){
        el.style.setProperty('--asset',selected.col);
      }
    }
    return container.innerHTML;
  };
  function yearlyValue(t,y){
    const h=t.history?.find(x=>x.cycle===y*3&&Number.isFinite(x.nw));
    const v=h?.nw??t.yearly?.[y]?.netWorth;
    return Number.isFinite(v)?v:null;
  }
  const dollars=v=>'$'+Math.round(v).toLocaleString('en-AU');
  function svgWealthGraph(t,view){
    const all=(t.history||[]).filter(x=>Number.isFinite(x.nw)&&Number.isFinite(x.cycle)).sort((a,b)=>a.cycle-b.cycle);
    const map=new Map(all.map(x=>[x.cycle,x.nw]));
    if(!map.has(0))map.set(0,S.startCash||2500);
    const maxCycle=Math.max(0,...map.keys()),w=960,h=274,L=78,R=21,T=21,B=43,innerW=w-L-R,innerH=h-T-B;
    const mx=Math.max(3000,...map.values())*1.13,axisMax=Math.ceil(mx/1000)*1000;
    const X=c=>L+innerW*c/30,Y=v=>T+innerH*(1-v/axisMax);
    const vals=(view==='year'?[...map].filter(([cy])=>cy===0||cy%3===0):[...map]).sort((a,b)=>a[0]-b[0]);
    let grid='',labels='';
    for(let j=0;j<=4;j++){
      const value=axisMax*j/4,y=Y(value);
      grid+=`<line x1="${L}" x2="${w-R}" y1="${y}" y2="${y}" stroke="#315574" stroke-dasharray="4 6"/>`;
      labels+=`<text x="${L-9}" y="${y+5}" text-anchor="end" fill="#bbd5ea" font-size="14">${dollars(value)}</text>`;
    }
    let years='';
    for(let year=0;year<=10;year++){
      const x=X(year*3);
      years+=`<text x="${x}" y="${h-12}" text-anchor="middle" fill="#bdd9ec" font-size="13">${year===0?'Start':'Y'+year}</text>`;
      if(year===5)years+=`<line x1="${x}" x2="${x}" y1="${T}" y2="${h-B}" stroke="#eebc56" stroke-dasharray="4 7" stroke-opacity=".7"/><text x="${x+7}" y="${T+14}" font-size="12" fill="#ffd689">Halfway</text>`;
    }
    const pts=vals.map(([c,v])=>`${X(c).toFixed(1)},${Y(v).toFixed(1)}`).join(' ');
    let dots='';
    for(const [cy,v] of vals){
      if(cy!==maxCycle&&cy%3!==0)continue;
      const year=cy===0?'Start':`Year ${Math.ceil(cy/3)}, Cycle ${((cy-1)%3)+1}`;
      dots+=`<circle cx="${X(cy)}" cy="${Y(v)}" r="${cy===maxCycle?5.5:3.5}" fill="#35d6c7" stroke="#071c30" stroke-width="2"><title>${year}: ${fm(v)}</title></circle>`;
    }
    const caption=view==='year'?'End-of-year balances':'Each completed economic cycle';
    return `<svg class="rr61-wealth-svg" viewBox="0 0 ${w} ${h}" role="img" aria-label="Net worth over ten years. ${caption}; current value ${fm(vals.at(-1)?.[1]||S.startCash)}."><defs><linearGradient id="rr61-wealth-area" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#2dd4bf" stop-opacity=".19"/><stop offset="100%" stop-color="#2dd4bf" stop-opacity="0"/></linearGradient></defs>${grid}${labels}${years}${vals.length>1?`<polygon points="${X(vals[0][0])},${Y(0)} ${pts} ${X(vals.at(-1)[0])},${Y(0)}" fill="url(#rr61-wealth-area)"/>`:''}<polyline points="${pts}" fill="none" stroke="#2dd4bf" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"/>${dots}</svg>`;
  }
  function wealthMarkup(t){
    const view=S.ui.wealthView==='year'?'year':'all';
    let cards='';
    for(let y=1;y<=10;y++){
      const v=yearlyValue(t,y);
      cards+=`<div class="rr61-wealth-card ${v===null?'pending':''}"><small>Year ${y}</small><strong>${v===null?'Not yet':fm(v)}</strong></div>`;
    }
    return `<section class="v60-wealth v6-wealth-compact rr61-wealth-chart"><div class="rr61-wealth-head"><div><h2>Net worth over time</h2><p>Includes wages, cash, savings, investments and super. This is not investment profit.</p></div><div class="rr61-wealth-switch"><button type="button" aria-pressed="${view==='all'}" onclick="UI.wealthView('all')">All cycles</button><button type="button" aria-pressed="${view==='year'}" onclick="UI.wealthView('year')">Year-end</button></div></div>${svgWealthGraph(t,view)}<div class="rr61-wealth-card-grid">${cards}</div><p class="rr61-wealth-help">Each point shows your recorded net worth. The chart uses a $0 baseline and the amber divider marks the halfway point.</p></section>`;
  }
  UI.wealthView=function(v){S.ui.wealthView=v==='year'?'year':'all';render()};
  const originalPerformance=performance;
  performance=function(t){
    const wrapper=document.createElement('div');wrapper.innerHTML=originalPerformance(t);
    const graph=wrapper.querySelector('.v60-wealth');if(graph)graph.outerHTML=wealthMarkup(t);
    const metrics=wrapper.querySelectorAll('.v6-performance-quick .v6-kpis>div');
    for(const m of metrics){
      const strong=m.querySelector('strong');if(!strong)continue;
      const value=strong.textContent.trim(),positive=value.startsWith('+'),negative=value.startsWith('-')||value.startsWith('−');
      strong.textContent=value;strong.classList.remove('positive','negative');
      if(positive)strong.classList.add('positive');if(negative)strong.classList.add('negative');
    }
    if(S.phase==='review'&&cycleNow(S)===3){
      const y=yearsNow(S),note=t.yearNotes?.[y]||'',html=`<section class="rr61-year-prompt" aria-label="Year ${y} decision record"><label for="rr61-annual-note">Year ${y} decision / observation</label><input id="rr61-annual-note" maxlength="200" value="${escapeHtml(note)}" placeholder="Write one important financial decision or observation" oninput="UI.yearNote(${y},this.value)"/><p>Record one sentence about your financial choices this year. It will appear in your ten-year financial record and final report.</p></section>`;
      const checkpoint=wrapper.querySelector('#checkpoint-panel');
      if(checkpoint)checkpoint.insertAdjacentHTML('beforeend',html);
      else{const tbl=wrapper.querySelector('.v59-featured');if(tbl)tbl.insertAdjacentHTML('beforebegin',html)}
    }
    return wrapper.innerHTML;
  };
  const oldResults=resultsOverlay;
  resultsOverlay=function(t){
    const html=oldResults(t);
    if(S.phase!=='review'||cycleNow(S)!==3||[2,5,10].includes(yearsNow(S)))return html;
    const y=yearsNow(S),note=t.yearNotes?.[y]||'';
    const wrapper=document.createElement('div');wrapper.innerHTML=html;
    const buttons=wrapper.querySelector('.review-cta');
    if(buttons)buttons.insertAdjacentHTML('beforebegin',`<section class="rr61-year-prompt"><label for="rr61-year-note-overlay">Year ${y}: One key financial decision or observation</label><input id="rr61-year-note-overlay" maxlength="200" value="${escapeHtml(note)}" placeholder="What did you decide or learn this year?" oninput="UI.yearNote(${y},this.value)"/><p>Saved automatically in your ten-year financial record.</p></section>`);
    return wrapper.innerHTML;
  };
})();
</script>

<script id="rr61-refine-script">
(()=>{
  const prevStudent = student;
  student = function(){
    const t=findTeam(),body=S.ui.studentTab==='invest'?invest(t):S.ui.studentTab==='performance'?performance(t):S.ui.studentTab==='learn'?learning(t):v55Settings();
    return `<div class="page student rr61-student-compact">${exploreGuide()}${body}</div>`;
  };

  const prevAssetTile = assetTile;
  assetTile = function(a,t){
    if(!viewable(a)) return prevAssetTile(a,t);
    const id=a.id,p=assetPrice(S,id),start=S.priceAtCycleStart[id],delta=start?100*(p/start-1):0;
    const held=t.hold[id],pnl=held?round(held.qty*p-held.cost):0;
    const riskText=(a.risk==='Medium–High'?'Med-High':a.risk);
    const income=a.yield>0?`${a.id==='BOND'?'Coupon':a.id==='PROP'?'Distribution':a.group==='funds'?'Income yield':'Dividend'}: ${a.yield}% p.a.`:'No investment income';
    const heldText=held?`<span class="rr61-held-label">Held: ${held.qty} units</span><span class="rr61-held-pnl ${pnl>=0?'positive':'negative'}">${pNum(pnl)}</span>`:'<span class="rr61-held-label muted">Not held</span>';
    return `<article class="tile rr61-tile ${S.ui.selected===id?'sel':''}" data-asset="${id}" style="--asset:${a.col}"><button type="button" class="tile-main" id="tile-${id}" aria-pressed="${S.ui.selected===id}" aria-label="Select ${escapeHtml(a.name)}; current price ${fm(p)}" onclick="UI.pick('${id}')"><span class="rr61-card-head"><span class="rr61-title-block"><span class="rr61-card-title"><span class="rr61-ticker">${escapeHtml(a.ticker)}</span><span class="rr61-name">${escapeHtml(a.short||a.name)}</span></span><span class="tile-risk ${riskColour(a.risk)}">Risk: ${escapeHtml(riskText)}</span></span><span class="rr61-card-right"><strong class="rr61-price">${fm(p)}</strong><span class="rr61-change ${delta>=0?'positive':'negative'}">${fmtPct(delta)}</span></span></span><span class="rr61-card-foot"><span class="rr61-income ${a.yield>0?'':'no-income'}">${escapeHtml(income)}</span><span class="rr61-held">${heldText}</span></span></button></article>`;
  };

  const prevSavings = savings;
  savings = function(t){
    const wrap=document.createElement('div');
    wrap.innerHTML=prevSavings(t);
    const s=wrap.querySelector('.savings');
    if(!s) return wrap.innerHTML;
    const grid=s.querySelector('.v61-term-grid') || s.querySelector('.deposit-choices');
    if(grid){
      [...grid.querySelectorAll('.deposit-option')].forEach(opt=>{
        opt.classList.add('v61-term-card');
        const btn=opt.querySelector('button');
        if(btn){btn.classList.remove('subtle');btn.classList.add('success');btn.textContent='Open';}
        const info=opt.querySelector('div');
        if(info && !info.querySelector('.v61-term-meta')){
          const strong=info.querySelector('strong');
          const meta=info.querySelector('.small.muted');
          if(strong && meta){
            const txt=(meta.textContent||'').replace(/\s+/g,' ').trim();
            const bits=txt.split('·').map(x=>x.trim()).filter(Boolean);
            const period=bits[0]||'';
            const rate=(txt.match(/(\d+(?:\.\d+)?)% p\.a\./)||[])[0]||'';
            const mat=bits.slice(2).join(' · ') || bits[1] || '';
            info.innerHTML=`<strong>${strong.textContent.trim()}</strong><div class="v61-term-meta"><span class="v61-term-period">${period}</span><span class="v61-term-rate">${rate}</span><span class="v61-term-maturity">${mat}</span></div>`;
          }
        }
      });
    }
    return wrap.innerHTML;
  };

  const introIcon = {PROP:'🏘️',GOLD:'🟡',SHOP:'🛍️',MINE:'⛏️',TECH:'💻',ENERGY:'⚡',ORBIT:'🧠',HEALTH:'🩺',GLOBAL:'🌍',TECHETF:'🧬',RESETF:'⛏️',RENEW:'☀️',COPPER:'🟠',OIL:'🛢️'};
  function introRisk(r){return r==='Medium–High'?'Med-High':r}
  function introMeta(a){
    const ret=`Return target: ${a.mu}% p.a.`;
    let inc='Income: none';
    if(a.yield>0){ inc = `Income: ${a.yield}% ${a.id==='PROP'?'distribution':a.id==='BOND'?'coupon':a.group==='funds'?'yield':'yield'} p.a.`; }
    return `${ret} · ${inc}`;
  }
  function buildIntroCard(id){
    const a=AS(id), icon=introIcon[id]||'📈';
    return `<div class="v61-intro-card" style="--asset:${a.col}"><b>${icon} ${escapeHtml(a.ticker)} · ${escapeHtml(a.short||a.name)}</b><div class="v61-intro-sub"><span class="tile-risk ${riskColour(a.risk)} rr61-intro-risk">Risk: ${escapeHtml(introRisk(a.risk))}</span></div><div class="v61-intro-meta">${escapeHtml(introMeta(a))}</div></div>`;
  }
  const prevIntroBody = introBody;
  introBody = function(id){
    if(id==='prop-gold') return `<div class="v61-intro-grid">${buildIntroCard('PROP')}${buildIntroCard('GOLD')}</div><p class="v61-intro-note">Property funds can provide income but react to rates and rents. Gold pays no income and may move differently from shares.</p>`;
    if(id==='shares') return `<div class="v61-intro-grid">${['SHOP','MINE','TECH','ENERGY'].map(buildIntroCard).join('')}</div><p class="v61-intro-note">These are individual companies, so prices can react strongly to company-specific results.</p>`;
    if(id==='new-sectors') return `<div class="v61-intro-grid">${['ORBIT','HEALTH'].map(buildIntroCard).join('')}</div><p class="v61-intro-note">Compare technology demand and competition with the steadier but regulated health-care sector.</p>`;
    if(id==='intl') return `<div class="v61-intro-grid">${['GLOBAL','TECHETF'].map(buildIntroCard).join('')}</div><p class="v61-intro-note">An ETF spreads your money across multiple companies, but international and sector-specific risks still remain.</p>`;
    if(id==='energy-new') return `<div class="v61-intro-grid">${['RESETF','RENEW'].map(buildIntroCard).join('')}</div><p class="v61-intro-note">Compare a diversified resources-and-energy ETF with a single renewables company.</p>`;
    if(id==='commod') return `<div class="v61-intro-grid">${['COPPER','OIL'].map(buildIntroCard).join('')}</div><p class="v61-intro-note">Commodity funds in this game do not pay income. Their returns depend on price movements.</p>`;
    return prevIntroBody(id);
  };

  const prevInvest = invest;
  invest = function(t){
    const wrap=document.createElement('div');
    wrap.innerHTML=prevInvest(t);
    wrap.querySelectorAll('.rr61-tile .new-badge').forEach(el=>el.remove());
    return wrap.innerHTML;
  };
})();
</script>

<script id="rr61-typography-results-script">
(()=>{
  const priorResultsOverlay=resultsOverlay;
  resultsOverlay=function(t){
    const markup=priorResultsOverlay(t);
    if(!markup||!t?.last?.assetMoves?.length)return markup;
    const holder=document.createElement('div');
    holder.innerHTML=markup;
    const table=holder.querySelector('.v6-review-dialog .v59-table tbody');
    if(!table)return markup;
    const rows=table.querySelectorAll('tr');
    const moves=t.last.assetMoves;
    for(let i=0;i<Math.min(rows.length,moves.length);i++){
      const a=AS(moves[i].id);
      if(!a||!a.ticker)continue;
      const cell=rows[i].querySelector('td');
      if(!cell)continue;
      const wrapper=document.createElement('span');
      wrapper.className='rr61-result-asset';
      const chip=document.createElement('span');
      chip.className='rr61-result-ticker';
      chip.style.setProperty('--asset',a.col);
      chip.textContent=a.ticker;
      const name=document.createElement('span');
      name.className='rr61-result-name';
      name.textContent=a.short||a.name;
      wrapper.append(chip,name);
      cell.replaceChildren(wrapper);
    }
    return holder.innerHTML;
  };
})();
</script>

<script id="rr61-portfolio-script">
/* Risk & Reward V6.1: visual-only portfolio analysis and economic review */
(()=>{
  const factors = [
    {key:'rates',re:/interest rates?|central bank|borrow(?:ing)?|inflation|repayments?|financ(?:ing|e) costs?|monetary/i,effect:'Interest-rate expectations can influence bond prices and borrowing costs for property and businesses.'},
    {key:'property',re:/property|rental|rents?|housing|real estate|landlord/i,effect:'Rental demand, property values and financing costs can affect property investments.'},
    {key:'trade',re:/freight|shipping|imports?|exports?|international trade|tariffs?|border|global supply chain|logistics/i,effect:'Trade and transport conditions can change costs and demand for importers and exporters.'},
    {key:'consumer',re:/household|retail|shopp(?:ing|ers?)|consumer|spending|sales|demand from customers/i,effect:'Changes in household spending can influence businesses that sell goods and services.'},
    {key:'energy',re:/oil|fuel|energy supply|electricity|power generation|petroleum/i,effect:'Energy supply and fuel demand can affect energy producers and businesses using energy.'},
    {key:'copper',re:/copper|electrification|industrial materials|construction materials/i,effect:'Industrial production and materials demand can influence copper-related investments.'},
    {key:'mining',re:/mining|minerals|resources orders|metals|mine production|infrastructure projects/i,effect:'Materials demand and production costs can influence mining and resource businesses.'},
    {key:'tech',re:/software|technology|digital|tech companies|innovation/i,effect:'Product demand, competition and financing costs can influence technology businesses.'},
    {key:'healthcare',re:/healthcare|health care|medical|hospitals|clinics/i,effect:'Essential healthcare demand can be steadier, but staff, regulation and costs still matter.'},
    {key:'renewables',re:/renewables?|solar|wind power|energy storage|clean energy/i,effect:'Renewable energy projects can respond to demand, costs, financing and government policy.'},
    {key:'safety',re:/uncertainty|confidence|safe haven|flight to safety|financial stress/i,effect:'Periods of uncertainty can change demand for defensive investments.'}
  ];
  function analysis(t){
    // Reuse the existing engine's holdings and current-price calculations.
    const holdings=Object.entries(t.hold||{}).filter(([id,h])=>AS(id)&&Number(h.qty)>0).map(([id,h])=>({id,v:Number(h.qty)*assetPrice(S,id)})).filter(h=>Number.isFinite(h.v)&&h.v>0).sort((a,b)=>b.v-a.v);
    const total=holdings.reduce((sum,h)=>sum+h.v,0);
    const largest=holdings[0]||null;
    const pct=largest&&total>0?100*largest.v/total:0;
    const holdingCount=holdings.length;
    const status=holdingCount===0?'No investments':pct>=60?'High concentration':pct>=40?'Some concentration':'Relatively spread';
    return {total,holdings,largest,pct,other:Math.max(0,100-pct),holdingCount,status,year:yearsNow(S)};
  }
  function investmentType(a){
    if(!a)return 'none';
    if(a.id==='BOND')return 'bond';
    if(a.id==='TECHETF'||a.id==='RESETF')return 'sector-etf';
    if(a.kind==='ETF')return 'broad-etf';
    if(a.id==='PROP')return 'property';
    if(a.group==='commodities')return 'commodity';
    if(a.group==='shares')return 'company';
    return 'fund';
  }
  function explain(t,x){
    if(!x.largest)return 'Investing in an asset will show how much of your invested money it represents. Cash, savings, deposits and super are not included in this percentage.';
    const a=AS(x.largest.id);
    switch(investmentType(a)){
      case 'bond':return 'Government bonds generally have lower price swings than company shares, but their prices can still react to interest rates. A large bond holding may limit growth opportunities.';
      case 'broad-etf':return 'This ETF holds multiple companies, so one fund can provide diversification. It can still lose value when wider markets decline.';
      case 'sector-etf':return 'This ETF holds several companies in one industry. It reduces dependence on a single company, but not exposure to an industry downturn.';
      case 'property':return 'Property funds can receive rental-style income, but their value is sensitive to property markets, demand and borrowing costs.';
      case 'commodity':return 'Commodity fund prices can move sharply with global supply and demand. Commodity funds in this game do not pay investment income.';
      case 'company':return 'A large holding in one company increases the effect of company-specific news and results on your portfolio.';
      default:return 'Spreading money across investment types can reduce some risks, but all investments can still lose value.';
    }
  }
  function sectorCluster(x, ids){
    const matches=x.holdings.filter(h=>ids.includes(h.id));
    return {count:matches.length,share:x.total>0?100*matches.reduce((s,h)=>s+h.v,0)/x.total:0};
  }
  function guidance(t,x){
    if(!x.largest)return 'You have not bought an investment yet. You can compare options before the next trading deadline.';
    if(x.year<=1)return 'Only two investments are available in Year 1, so some concentration is normal while you learn how the market works.';
    const a=AS(x.largest.id),type=investmentType(a),name=a.short||a.name,share=Math.round(x.pct);
    if(x.year>=3 && x.pct>=60 && type==='company'){
      const loss=Math.round(x.pct*0.20);
      return `${share}% of your invested money is in ${name}, one company. A 20% fall in its price could reduce your invested portfolio by about ${loss}% if other prices did not change.`;
    }
    if(x.pct>=60 && type==='sector-etf')return `${share}% is in ${name}. This ETF includes multiple companies, but it remains exposed to one industry.`;
    if(x.pct>=50 && type==='bond')return `${share}% of your invested money is in government bonds. Their prices can move with interest rates, and returns may be lower than some riskier investments.`;
    if(x.pct>=60 && type==='broad-etf')return `${share}% is in ${name}. The ETF holds many companies, but a broad market downturn can still reduce its value.`;
    if(x.pct>=50 && type==='property')return `${share}% is in a property fund. Rental income and property values can be affected by borrowing costs and economic demand.`;
    if(x.pct>=50 && type==='commodity')return `${share}% is in ${name}. Prices can move sharply with supply and demand, and this fund does not pay investment income.`;
    if(x.pct>=50 && type==='company')return `${share}% of your invested money is in ${name}. One company's disappointing results could have a large impact.`;
    if(x.year>=3){
      const tech=sectorCluster(x,['TECH','ORBIT','TECHETF']);
      if(tech.count>=2&&tech.share>=45)return `${Math.round(tech.share)}% of your investments are connected to technology. Holding different companies and a sector ETF does not remove technology-sector risk.`;
      const resource=sectorCluster(x,['MINE','ENERGY','RESETF','COPPER','OIL']);
      if(resource.count>=2&&resource.share>=50)return `Several of your investments depend on resources and energy. They may react to some of the same economic developments.`;
    }
    const liquid=Number(t.cash||0)+Number(t.sav||0),totalWorth=totalNet(S,t);
    if(x.year>=3&&liquid<100&&totalWorth>500)return 'Most of your money is invested or locked away. Consider whether you have enough accessible cash for future decisions.';
    if(x.pct>=40)return `Your largest holding represents ${share}% of invested money. Consider how it differs from your other investments.`;
    return `You hold ${x.holdingCount} investments with no single position above 40%. This spreads some concentration risk, but markets and shared industries can still fall.`;
  }
  function content(t,variant){
    const x=analysis(t),modal=variant==='modal',a=x.largest?AS(x.largest.id):null;
    if(!a){
      return `<section class="rr61-portfolio-check ${modal?'rr61-pc-modal':''}" aria-label="Portfolio check"><div class="rr61-pc-heading"><b class="rr61-pc-title">Portfolio check</b><span class="rr61-pc-status">No investments</span></div><p class="rr61-pc-empty">No investments held yet. Buy an investment to see your concentration.</p></section>`;
    }
    const share=Math.max(0,Math.min(100,x.pct)),shown=Math.round(share),otherShown=100-shown;
    const name=escapeHtml(a.short||a.name),tip=escapeHtml(explain(t,x));
    const bar=`<div class="rr61-pc-bar" role="img" aria-label="${shown}% in ${name}, ${otherShown}% in other investments"><span class="rr61-pc-part-main" style="width:${share.toFixed(3)}%"></span><span class="rr61-pc-part-other" style="width:${(100-share).toFixed(3)}%"></span></div>`;
    const tipId=modal?'rr61-pc-tip-modal':'rr61-pc-tip-live';
    return `<section class="rr61-portfolio-check ${modal?'rr61-pc-modal':''}" aria-label="Portfolio check"><div class="rr61-pc-heading"><b class="rr61-pc-title">Portfolio check</b><span class="rr61-pc-info-wrap"><button class="rr61-pc-info" type="button" aria-label="What does this mean?" aria-controls="${tipId}" aria-describedby="${tipId}" aria-expanded="false" onclick="UI.rr61ToggleInfo(this)">ⓘ</button><span class="rr61-pc-popover" id="${tipId}" role="tooltip">${tip}</span></span></div><div class="rr61-pc-main"><strong>Largest: ${name} <span class="rr61-pc-status">${escapeHtml(a.ticker)}</span></strong><span class="rr61-pc-percent">${shown}%</span></div>${bar}<div class="rr61-pc-legend"><span>${shown}% ${name}</span><span>${otherShown}% other investments</span></div></section>`;
  }
  UI.rr61ToggleInfo=function(button){
    const open=button.getAttribute('aria-expanded')==='true';
    button.setAttribute('aria-expanded',String(!open));
  };
  document.addEventListener('click',event=>{
    document.querySelectorAll('.rr61-pc-info[aria-expanded="true"]').forEach(button=>{
      if(!button.closest('.rr61-pc-info-wrap')?.contains(event.target))button.setAttribute('aria-expanded','false');
    });
  });
  // Single calculation and message functions shared by the persistent panel and the confirmation.
  const oldInvest=invest;
  invest=function(t){
    const html=oldInvest(t),node=document.createElement('div');node.innerHTML=html;
    const tabs=node.querySelector('.group-tabs');
    if(tabs){
      const row=document.createElement('div');row.className='rr61-portfolio-row';
      tabs.replaceWith(row);row.appendChild(tabs);
      const widget=document.createElement('div');widget.innerHTML=content(t,'live');
      row.appendChild(widget.firstElementChild);
    }
    return node.innerHTML;
  };
  const oldMaybeOverlay=maybeOverlay;
  maybeOverlay=function(){
    oldMaybeOverlay();
    if(!(S.phase==='trading'&&S.ui?.v6ConfirmFinish&&S.ui?.view==='student'))return;
    const dlg=document.querySelector('#modal .v6-confirm-dialog');
    if(!dlg)return;
    const warning=dlg.querySelector('.v6-confirm-warning');
    if(!warning)return;
    const t=findTeam();
    warning.querySelector('b').textContent=yearsNow(S)===1?'A first-year consideration':'Something to consider';
    const p=warning.querySelector('p');if(p)p.textContent=guidance(t,analysis(t));
    warning.insertAdjacentHTML('beforebegin',content(t,'modal'));
  };
  // Use only currently revealed economic information, not hidden future outcomes.
  const oldResultsOverlay=resultsOverlay;
  resultsOverlay=function(t){
    const html=oldResultsOverlay(t);
    if(!html)return html;
    const container=document.createElement('div');container.innerHTML=html;
    const area=container.querySelector('.v6-price-explain');
    if(!area)return html;
    const development=area.querySelector('p')?.textContent?.trim()||'';
    if(!development)return html;
    const publicText=[development,S.beat?.title||''].join(' ');
    let topics=factors.filter(f=>f.re.test(publicText)).slice(0,2);
    // More than one factor can matter, but avoid pretending news explains every return.
    const marketEffects=topics.length?topics.map(f=>f.effect).join(' '):'No major industry shock was identified. Investments can still change value as expectations and ordinary trading evolve.';
    const held=Object.entries(t.hold||{}).filter(([id,h])=>h.qty>0&&AS(id));
    const linked=held.map(([id,h])=>{
      const a=AS(id),score=topics.reduce((acc,f)=>acc+Math.abs(Number(a.exp?.[f.key]||0)),0);
      return {a,score};
    }).filter(x=>x.score>=0.35).sort((a,b)=>b.score-a.score).slice(0,2);
    const relevant=linked.length?`<div><dt>Your investments</dt><dd>${linked.map(x=>escapeHtml(x.a.short||x.a.name)).join(' and ')} ${linked.length===1?'has':'have'} exposure to the economic factors discussed. Their actual price movements also depend on other influences.</dd></div>`:'';
    area.className='v6-price-explain rr61-market-explain';
    area.innerHTML=`<h3>What influenced the market this cycle?</h3><dl><div><dt>Economic development</dt><dd>${escapeHtml(development)}</dd></div><div><dt>Possible market effects</dt><dd>${escapeHtml(marketEffects)}</dd></div>${relevant}</dl><p class="rr61-market-note">News is one influence on prices, not a guaranteed forecast. Normal market fluctuations also matter.</p>`;
    return container.innerHTML;
  };
})();

</script>

<script id="rr-public-release-script">
(()=>{
  // Keep save formats, class-seeded market model and the entire financial engine unchanged.
  document.title='Risk & Reward | Financial Challenge';
  learnUnlocked=function(){return true};

  // Practice challenges are available at any time. Annual bonus challenges remain
  // restricted to their normal cycle checkpoints.
  v55Practice=function(t){
    const idx=Number(t.practiceCount)||0,q=PRACTICE[idx%PRACTICE.length];
    return `<section class="panel"><h2>Financial skills challenges</h2><p class="rr-public-practice-note">Practise at any time, including before you begin or after you finish the game. These questions explain financial ideas and do not award game money. Separate annual challenges may offer rewards during the game.</p><p class="eyebrow">PRACTICE QUESTION ${idx+1}</p><h3>${escapeHtml(q.q)}</h3><div class="answers">${q.a.map((answer,i)=>`<button type="button" class="answer" ${t.practiceFeedback?'disabled':''} onclick="UI.practiceAnswer(${i})">${'ABC'[i]} · ${escapeHtml(answer)}</button>`).join('')}</div>${t.practiceFeedback?`<div class="financial-note"><b>${escapeHtml(t.practiceFeedback)}</b> <button type="button" class="btn" onclick="UI.practiceNext()">Next question</button></div>`:''}</section>`;
  };

  UI.practiceAnswer=function(index){
    const t=findTeam(),q=PRACTICE[(t.practiceCount||0)%PRACTICE.length];
    if(t.practiceFeedback||!Number.isInteger(index)||index<0||index>=q.a.length)return;
    t.practiceFeedback=(index===q.correct?'Correct. ':'Not quite. ')+q.why;
    render();
  };

  // Investment concepts can be read in Learn at any point. Unlock announcements
  // still appear at the originally agreed years during the actual game.
  introsPanel=function(){
    return `<section class="panel"><h2>Investment introductions</h2><p class="small muted">Read about each investment type whenever you like. New investments will still be announced as they become available during the game.</p>${INTROS.map(d=>`<details class="rr-public-guide"><summary>${d.icon} ${escapeHtml(d.title)} · Year ${d.year}</summary><div class="rr-public-guide-body">${introBody(d.id)}</div></details>`).join('')}</section>`;
  };

  // Keep the original navigation behaviour for game pages, but never lock Learn.
  const previousStudentTab=UI.studentTab;
  UI.studentTab=function(tab){
    if(tab==='learn'){
      S.ui.view='student';S.ui.studentTab='learn';render();return;
    }
    previousStudentTab.call(this,tab);
  };
  UI.openLearning=function(){S.ui.view='student';S.ui.studentTab='learn';render();window.scrollTo(0,0)};
  UI.returnHome=function(){S.ui.view='home';S.ui.studentTab='invest';render();window.scrollTo(0,0)};

  const previousRoleHeader=roleHeader;
  roleHeader=function(){
    let h=previousRoleHeader();
    h=h.replace(/<small>[^<]*(?:PREVIEW|V6\.1|STUDENT EDITION)[^<]*<\/small>/gi,'');
    const nav=S.ui.view==='student'?`<nav class="v60-nav" aria-label="Game navigation">${[['invest','Invest'],['performance','Performance'],['learn','Learn & Challenges'],['settings','Settings']].map(([tab,title])=>`<button type="button" class="${S.ui.studentTab===tab?'active':''}" aria-current="${S.ui.studentTab===tab?'page':'false'}" onclick="UI.studentTab('${tab}')">${title}</button>`).join('')}</nav>`:'';
    h=h.replace(/<nav class="v60-nav">[\s\S]*?<\/nav>/,nav);
    // A clear route home is available even while consulting learning material.
    if(S.phase==='lobby'){
      h=h.replace(/<button class="light" onclick="UI.saveExit\(\)">Save &amp; Exit<\/button>/,'<button class="light" onclick="UI.returnHome()">Home</button>');
    }
    return h;
  };

  home=function(){
    const ongoing=S.phase!=='lobby',t=findTeam();
    const progress=S.phase==='explore'?'Before Year 1':S.phase==='ended'?'Ten-year game completed':`Year ${Math.min(10,yearsNow(S))}, Cycle ${cycleNow(S)}`;
    const fields=`<div class="setting-grid"><label>Student name<input id="player-name" maxlength="48" autocomplete="name" placeholder="Your name"/></label><label>Shared class market code<input id="player-class" maxlength="36" placeholder="e.g. 9HASS-A" value="9HASS-A"/></label><label>Your financial goal<select id="player-goal"><option value="short">Need money soon</option><option value="medium" selected>Build a goal in 3–5 years</option><option value="long">Build wealth over ten years</option></select></label><label>Your risk tolerance<select id="player-risk"><option value="low">Low</option><option value="medium" selected>Medium</option><option value="high">High</option></select></label></div>`;
    const summary=`<p class="rr-public-saved"><b>Student:</b> ${escapeHtml(t.name)} · <b>Class economy:</b> ${escapeHtml(S.marketCode||'DEMO-CLASS')}<br/><b>Progress:</b> ${progress}</p>`;
    const primary=ongoing?`<button class="btn v6-yellow" onclick="UI.continueGame()">${S.phase==='ended'?'View completed game':'Continue game'}</button>`:'<button class="btn v6-yellow" onclick="UI.startGame()">Start ten-year game</button>';
    return `<section class="welcome rr61-home rr-public-home"><p class="eyebrow">YEAR 9 ECONOMICS · FINANCIAL CHALLENGE</p><h1>RISK <span>&amp;</span> REWARD</h1><h2>One continuous ten-year financial game</h2><p class="rr-public-intro">Make decisions about saving, investments and risk as your class economy changes. Save your progress and return at any time.</p><div class="panel start-panel">${ongoing?summary:fields}<div class="rr-public-actions">${primary}<button class="btn subtle rr-home-learn" onclick="UI.openLearning()">Learn &amp; Challenges</button><button class="btn subtle" onclick="UI.load()">Load saved game (.json)</button>${reportReady()?'<button class="btn" onclick="UI.reportPreview()">View final report</button>':''}</div>${ongoing?`<div class="rr-public-secondary"><button class="btn danger" onclick="UI.restartGame()">${S.phase==='ended'?'Play again · New game':'Restart game'}</button></div>`:''}</div><p class="small muted">All investments and prices are fictional and intended for classroom learning.</p></section>`;
  };

  UI.continueGame=function(){
    S.ui.view='student';
    S.ui.studentTab=S.phase==='ended'?'performance':'invest';
    render();window.scrollTo(0,0);
  };

  // One click starts Year 1. There is no separate external launcher or forced
  // Explore Mode. The existing Year 1 introduction and economic news still run.
  const previousStartGame=UI.startGame;
  UI.startGame=function(){
    const wasLobby=S.phase==='lobby';
    previousStartGame.call(this);
    if(wasLobby&&S.phase==='explore'){
      S.phase='lobby';S.ui.view='student';S.ui.studentTab='invest';S.ui.group='banking';
      respond(beginCycle(S));
    }
  };

  UI.restartGame=function(){
    const reset=()=>{
      closeReportPreview();
      S=newGame({names:[['Student','']],botsEnabled:false});
      S.ui.view='home';S.ui.studentTab='invest';
      render();window.scrollTo(0,0);
      toast('A new game is ready. Enter your details to begin.');
    };
    if(S.phase==='lobby'){reset();return;}
    UI.classroomConfirm('Restart the ten-year game?',
      'This will replace your current progress saved in this browser. Download a JSON save before restarting if you want to keep a copy.',
      reset,'Restart game');
  };
  UI.reset=function(){UI.restartGame()};

  // Do not hide the Help / Learn screens on student navigation or on first visit.
  v55Settings=function(){
    const t=findTeam();
    return `<section class="panel rr-public-settings"><h2>Game settings</h2><p><b>Ten-year game</b> · ${S.phase==='lobby'?'Not started':S.phase==='ended'?'Completed':`Year ${Math.min(10,yearsNow(S))}`} · Shared class market code: <b>${escapeHtml(S.marketCode||'DEMO-CLASS')}</b></p><p class="small muted">The class market code stays fixed during a game. Your name and class label can be updated without changing market prices.</p><div class="setting-grid"><label>Student name<input id="settings-name" maxlength="48" value="${escapeHtml(t.name==='Student'?'':t.name)}"/></label><label>Class / form group<input id="settings-class" maxlength="36" value="${escapeHtml(t.schoolClass||'')}"/></label></div><button class="btn subtle" onclick="UI.updateIdentity()">Save name and class</button><div class="review-cta"><button class="btn v6-yellow" onclick="UI.saveExit()">Save &amp; Exit (.json)</button><button class="btn" onclick="UI.load()">Load saved game (.json)</button><button class="btn" onclick="UI.openLearning()">Learn &amp; Challenges</button>${reportReady()?'<button class="btn" onclick="UI.reportPreview()">View final report</button>':''}<button class="btn danger" onclick="UI.restartGame()">Restart game</button></div><p class="small muted">A restart replaces this browser's current game. Download a JSON backup first if you want to preserve your existing progress.</p></section>`;
  };

  // Remove public-facing edition labels while retaining internal version data
  // required for reliable old save import / migration.
  const originalReportMarkup=reportMarkup;
  reportMarkup=function(){
    return originalReportMarkup()
      .replace(/\s*·\s*V6\.1/g,'')
      .replace(/V6\.1\s*·\s*/g,'')
      .replace(/\bV6\.1\b/g,'');
  };
  printInvestmentReport=function(){
    if(!reportReady())return;
    if(!document.querySelector('#report-preview.is-open'))openReportPreview();
    const t=findTeam();
    document.title=`Risk_Reward_${safeFileToken(t.schoolClass)}_${safeFileToken(t.name)}_Ten_Year_Report`;
    window.print();
  };
  downloadRR61=function(){
    const blob=new Blob([JSON.stringify(rr61Payload(),null,2)],{type:'application/json'});
    const url=URL.createObjectURL(blob),a=document.createElement('a');
    a.href=url;
    a.download=`Risk_Reward_${safeFileToken(findTeam()?.name||'Student')}_Year${Math.min(10,yearsNow(S))}.json`;
    document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),15000);
  };

  // Hide monetary balances when the Learn page is opened without a started game.
  const originalDraw=draw;
  draw=function(){
    document.body.classList.toggle('rr-public-learning',S?.phase==='lobby'&&S?.ui?.view==='student'&&S.ui.studentTab==='learn');
    originalDraw();
  };
})();
</script>
