function lineGraph(series,width=680,height=210){const flat=series.flatMap(s=>s.values.filter(Number.isFinite));if(!flat.length)return'<p class="muted">No data yet.</p>';let lo=Math.min(...flat),hi=Math.max(...flat);if(hi===lo){lo-=1;hi+=1}const pad=(hi-lo)*.1;lo-=pad;hi+=pad;const l=56,r=15,t=16,b=27;const n=Math.max(1,...series.map(s=>s.values.length));const X=i=>l+(n<=1?(width-l-r)/2:i*(width-l-r)/(n-1));const Y=v=>t+(height-t-b)*(1-(v-lo)/(hi-lo));let h='';for(let i=0;i<4;i++){const v=lo+(hi-lo)*i/3;h+=`<line x1="${l}" x2="${width-r}" y1="${Y(v)}" y2="${Y(v)}" stroke="#28466f" stroke-dasharray="4 5"/><text x="${l-5}" y="${Y(v)+4}" text-anchor="end" fill="#8faaca" font-size="11">${Math.round(v).toLocaleString('en-AU')}</text>`}series.forEach(s=>{const pts=s.values.map((v,i)=>`${X(i)},${Y(v)}`).join(' ');h+=`<polyline points="${pts}" fill="none" stroke="${s.col}" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"/>`;s.values.forEach((v,i)=>{if(i===s.values.length-1)h+=`<circle cx="${X(i)}" cy="${Y(v)}" r="4" fill="${s.col}"><title>${escapeHtml(s.label)}: ${fm(v)}</title></circle>`})});return`<svg class="line-graph" viewBox="0 0 ${width} ${height}" role="img" aria-label="${escapeHtml(series.map(s=>s.label).join(' and '))} over time">${h}</svg><div class="graph-legend">${series.map(s=>`<span><i style="background:${s.col}"></i>${escapeHtml(s.label)}</span>`).join('')}</div>`}

 const entries=[['cash','1 · Find your cash','Money available to spend'],['banking','2 · Explore Banking','Savings and fixed-term deposits'],['funds','3 · Explore Funds & Bonds','Bonds, ETF, price charts and risk'],['trading','4 · Find the trade controls','Select a fund and inspect Buy/Sell']];
 return`<section class="explore-guide" aria-label="Explore the game"><div class="explore-label">Practice looking around · No money is spent</div><h2>Find your way around Risk &amp; Reward</h2><p>Explore the game before Year 1 begins. <b>Your prices, cash and financial results will not change.</b> Transactions are locked for now. Follow the four hints or explore freely.</p><div class="explore-actions">${entries.map(([id,title,sub])=>`<button type="button" class="explore-action ${seen[id]?'visited':''}" onclick="UI.exploreJump('${id}')">${seen[id]?'✓':'!'} ${title}<small>${sub}</small></button>`).join('')}</div><div class="explore-cta-note">Ready? Select the yellow <b>Start Year 1</b> button at the top right. Your first investment introduction and economic news will appear before trading starts.</div></section>`}
function setHeights(){const h=$('.top'),w=$('.wallet'),r=document.documentElement.style;r.setProperty('--hh',(h?h.offsetHeight:71)+'px');r.setProperty('--wh',(w?w.offsetHeight:0)+'px')}
function holdings(t){const ids=Object.keys(t.hold);if(!ids.length)return`<p class="muted short">No investments yet. Choose a market card to make your first purchase.</p>`;return`<div class="table-scroll"><table><thead><tr><th>Investment</th><th class="r">Units</th><th class="r">Current value</th><th class="r">Unrealised gain/loss</th><th class="r">Return</th></tr></thead><tbody>${ids.map(id=>{const a=AS(id),h=t.hold[id],v=h.qty*assetPrice(S,id);return`<tr><td><span class="dot" style="background:${a.col}"></span>${escapeHtml(a.name)}</td><td class="r">${h.qty}</td><td class="r">${fm(v)}</td><td class="r">${pNum(v-h.cost)}</td><td class="r">${pPercent((v/h.cost-1)*100)}</td></tr>`}).join('')}</tbody></table></div>`}
const GROUPS=[['banking','Banking'],['funds','Funds &amp; Bonds'],['shares','Shares'],['commodities','Commodities']];
const groupAssets=g=>A.filter(a=>a.group===g);
const viewable=a=>unlocked(S,a)||!!(findTeam()&&findTeam().hold[a.id]);
const groupOpen=g=>g==='banking'||groupAssets(g).some(viewable);
const groupFirstYear=g=>g==='banking'?1:Math.min(...groupAssets(g).map(a=>a.unlock));
const isNewAsset=a=>S.phase!=='lobby'&&yearsNow(S)>1&&a.unlock===yearsNow(S);
const groupIsNew=g=>g!=='banking'&&groupAssets(g).some(isNewAsset)&&!(S.ui.groupSeen||{})[g+':'+yearsNow(S)];
function curGroup(){let g=S.ui.group;if(!GROUPS.some(x=>x[0]===g)||!groupOpen(g))g='funds';return g}
function ensureSelected(g){if(g==='banking')return;const cur=AS(S.ui.selected);if(!cur||cur.group!==g||!viewable(cur)){const f=groupAssets(g).find(a=>unlocked(S,a))||groupAssets(g).find(viewable);S.ui.selected=f?f.id:null}}
const qtyVal=()=>Math.max(1,Math.floor(Number(S.ui.qty)||1));
function tradeLock(){if(S.paused&&S.phase!=='lobby'&&S.phase!=='ended')return'Trading is temporarily paused.';if(openForTrading(S))return'';return({lobby:'Begin the game to start trading.',explore:'Explore Mode: you can view investments but cannot trade until you start Year 1.',news:'Trading opens after the news phase. Use the time to plan.',review:'This cycle is closed. Trading reopens next cycle.',ended:'The campaign is complete.'})[S.phase]||'Trading is not open.'}
const lockNote=()=>{const m=tradeLock();return m?`<p class="small reason">${escapeHtml(m)}</p>`:''};
function assetTile(a,t){const id=a.id,open=viewable(a),p=assetPrice(S,id),base=S.priceAtCycleStart[id],chg=base?100*(p/base-1):0,sel=S.ui.selected===id,h=t.hold[id];
 if(!open)return`<article class="tile locked" style="--asset:${a.col}"><span class="tile-name">${escapeHtml(a.name)}</span><span class="small muted">${escapeHtml(a.kind)} · unlocks Year ${a.unlock}</span></article>`;
 const pnl=h?round(h.qty*p-h.cost):0;
 return`<article class="tile ${sel?'sel':''}" style="--asset:${a.col}"><button type="button" id="tile-${id}" class="tile-main" aria-pressed="${sel}" aria-controls="trade-panel" aria-label="Select ${escapeHtml(a.name)} at ${fm(p)}; risk ${escapeHtml(a.risk)}" onclick="UI.pick('${id}')"><span class="tile-name"><i class="dot" style="background:${a.col}"></i>${escapeHtml(a.name)}${isNewAsset(a)?' <span class="new-badge">NEW</span>':''}</span><span class="tile-risk ${riskColour(a.risk)}">Risk: ${escapeHtml(a.risk)}</span><span class="tile-price"><b>${fm(p)}</b>${pPercent(chg)}</span>${spark(S.prices[id],a.col)}<span class="tile-held">${h?`${h.qty} held · Gain/loss ${pNum(pnl)}`:'Not held'}</span></button></article>`;
}
function riskColour(label){if(/very high/i.test(label))return'risk-very';if(/medium.high/i.test(label))return'risk-medhigh';if(/high/i.test(label))return'risk-high';if(/medium/i.test(label))return'risk-medium';return'risk-low'}

function tradePanel(t){const a=AS(S.ui.selected);if(!a||!viewable(a))return`<aside class="trade-panel" id="trade-panel"><p class="muted">Select an investment to see its details and trade.</p></aside>`;
 const id=a.id,p=assetPrice(S,id),base=S.priceAtCycleStart[id],chg=base?100*(p/base-1):0,h=t.hold[id],pnl=h?round(h.qty*p-h.cost):0;
 const held=h?`<div class="tp-holding"><b>Your holding:</b> ${h.qty} units · ${fm(h.qty*p)}<br><b>Gain/loss:</b> ${pNum(pnl)} (${pPercent((h.qty*p/h.cost-1)*100)})</div>`:'<p class="tp-holding muted">You do not hold this investment yet.</p>';
 return`<aside class="trade-panel" id="trade-panel" aria-label="Trade ${escapeHtml(a.name)}"><div class="tp-head"><h3><i class="dot" style="background:${a.col}"></i>${escapeHtml(a.name)}</h3><span class="risk-badge ${riskColour(a.risk)}">Risk: ${escapeHtml(a.risk)}</span></div><div class="tp-price"><b>${fm(p)}</b> per unit · ${pPercent(chg)} this cycle</div><p class="tp-description">${ag(a.desc)}</p><div class="tp-chart">${lineGraph([{label:a.name+' unit price',values:S.prices[id].slice(-20),col:a.col}],420,205)}</div>${held}<details class="tp-assumptions"><summary>Expected return, volatility and risk</summary><p class="small muted">${ag('Modelled: about '+Number((a.mu+a.yield).toFixed(1))+'% a year (price + income), volatility '+a.sig+'%. Not guaranteed.')}</p></details><div class="trade-entry"><label for="qty">Units to trade</label><div class="inline-controls"><input id="qty" type="number" min="1" step="1" inputmode="numeric" aria-label="Units to trade" value="${qtyVal()}" oninput="UI.qty()"/><button type="button" class="btn subtle" onclick="UI.setQty(1)">1</button><button type="button" class="btn subtle" onclick="UI.setQty(5)">5</button><button type="button" class="btn subtle" onclick="UI.setQty('max')">Max</button>${h?'<button type="button" class="btn subtle" onclick="UI.setQty(\'all\')">All</button>':''}</div></div><div class="tp-sum" id="tp-sum" aria-live="polite"></div><div class="trade-buttons"><button type="button" id="btn-buy" class="btn success" aria-describedby="tp-status" onclick="UI.buy('${id}')">Buy</button><button type="button" id="btn-sell" class="btn danger" aria-describedby="tp-status" onclick="UI.sell('${id}')">Sell</button></div><p class="tp-status" id="tp-status" role="status"></p></aside>`}
function refreshTrade(){const a=AS(S.ui.selected),sum=$('#tp-sum'),q=$('#qty');if(!a||!sum||!q)return;const t=findTeam(),p=assetPrice(S,a.id),h=t.hold[a.id],raw=Number(q.value),valid=Number.isSafeInteger(raw)&&raw>0&&raw<=100000,lock=tradeLock();
 const cost=valid?round(raw*p):0,canBuy=valid&&unlocked(S,a)&&cost<=t.cash+1e-7,canSell=valid&&!!h&&raw<=h.qty,afford=Math.floor(t.cash/p);
 sum.innerHTML=!valid?'Enter a whole number of units.':`<div class="cost-pair"><span>Total cost to buy</span><b>${fm(cost)}</b></div>${h?`<div class="cost-pair"><span>Sale proceeds</span><b>${fm(cost)}</b></div>`:''}`;
 const why=[];if(!unlocked(S,a))why.push('Locked until Year '+a.unlock+'. You can sell units you hold.');if(valid&&!canBuy&&unlocked(S,a))why.push(afford>0?`You can afford up to ${afford} units.`:'Not enough cash.');if(valid&&h&&!canSell)why.push(`You hold ${h.qty} units.`);
 const lt=S.ui.lastTrade&&S.ui.lastTrade.id===a.id&&S.ui.lastTrade.c===S.cycle?S.ui.lastTrade:null,st=$('#tp-status');
 const msg=lock||why.join(' ')||(lt?lt.m:'');st.textContent=msg;st.className='tp-status '+(lock||why.length?'warn':lt&&lt.ok?'ok':'');
 $('#btn-buy').disabled=!!lock||!canBuy;$('#btn-sell').disabled=!!lock||!canSell;
}
function savings(t){
 const termRows=t.term.length?`<div class="term-holdings"><div class="subheading">Your fixed deposits</div><div class="table-scroll"><table><thead><tr><th>Type</th><th class="r">Balance</th><th class="r">Fixed rate</th><th>Matures</th></tr></thead><tbody>${t.term.map(x=>{const m=x.maturityAt??S.cycle+x.cyclesLeft;const y=Math.floor((m-1)/3)+1,c=(m-1)%3+1;return`<tr><td>${escapeHtml(TERM_CHOICES[x.kind]?.label||'Term deposit')}</td><td class="r">${fm(x.balance)}</td><td class="r">${x.annualRate}% p.a.</td><td>Year ${y}, Cycle ${c}</td></tr>`}).join('')}</tbody></table></div></div>`:'';
 const choices=[['short','Short-term deposit','1 year (3 cycles)'],['long','Long-term deposit','3 years (9 cycles)']];
 const remaining=S.totalYears*3-S.cycle;
 const available=choices.filter(([kind])=>remaining>=TERM_CHOICES[kind].cycles);
 const expiryNote=available.length===2?'':available.length===1?'The 3-year deposit is unavailable because it would mature after the campaign ends.':'Term deposits are no longer available because none can mature before the campaign ends.';
 return`<section class="panel savings"><div class="section-head"><h2>Savings and fixed deposits</h2><span class="muted small">Lower risk · Annual rates</span></div><div class="savings-grid"><div><div class="subheading">Savings account</div><p class="small muted">${S.savingsRate}% per year, compounded every cycle. Withdraw during trading.</p><p class="bank-balance">Savings balance <strong>${fm(t.sav)}</strong></p><label for="bank-amount">Amount ($)</label><input id="bank-amount" type="number" min="0.01" value="100" step=".01" oninput="UI.bankAmount()" aria-label="Amount to deposit or withdraw"/><div class="bank-actions"><button id="bank-deposit" class="btn success" onclick="UI.deposit()">Deposit</button><button id="bank-depositmax" class="btn subtle" onclick="UI.bankDoMax('deposit')">Deposit Max</button><button id="bank-withdraw" class="btn" onclick="UI.withdraw()">Withdraw</button><button id="bank-withdrawmax" class="btn subtle" onclick="UI.bankDoMax('withdraw')">Withdraw Max</button></div><p class="small muted" id="bank-note" aria-live="polite"></p>${lockNote()}</div><div><div class="subheading">Fixed-term deposits</div><p class="small muted">Lock money at a fixed rate. You cannot withdraw until maturity. Minimum $100; the term must finish before Year 10 ends.</p><div class="deposit-choices">${choices.map(([kind,label,period])=>{const enoughTime=remaining>=TERM_CHOICES[kind].cycles;const maturity=S.cycle+TERM_CHOICES[kind].cycles;const maturityYear=Math.ceil(maturity/3);return`<div class="deposit-option"><div><strong>${label}</strong><span class="small muted">${period} · ${S.termRates[kind]}% p.a.${enoughTime?' · matures Year '+maturityYear+', Cycle '+((maturity-1)%3+1):' · unavailable: insufficient years left'}</span></div><button class="btn ${kind==='long'?'':'subtle'}" ${openForTrading(S)&&enoughTime?'':'disabled'} onclick="UI.term('${kind}')">Open</button></div>`}).join('')}</div>${expiryNote?`<p class="small muted">${expiryNote}</p>`:''}<label for="term-amount">Deposit amount ($)</label><input id="term-amount" type="number" min="100" value="200"/>${lockNote()}</div></div>${termRows}</section>`;
}
function refreshBank(){const a=$('#bank-amount');if(!a)return;const t=findTeam(),n=Number(a.value),valid=Number.isFinite(n)&&n>0,lock=!openForTrading(S);const dep=$('#bank-deposit'),wd=$('#bank-withdraw'),dm=$('#bank-depositmax'),wm=$('#bank-withdrawmax');if(dep)dep.disabled=lock||!valid||n>t.cash;if(wd)wd.disabled=lock||!valid||n>t.sav;if(dm)dm.disabled=lock||t.cash<=0;if(wm)wm.disabled=lock||t.sav<=0;const note=$('#bank-note');if(note)note.textContent=lock?'Trading is closed.':!valid?'Enter a positive amount.':n>t.cash&&n>t.sav?'Amount is above both balances.':n>t.cash?'Not enough available cash to deposit.':n>t.sav?'Not enough savings to withdraw.':''}
function newsStrip(){if(!S.beat||S.phase==='lobby'||S.phase==='ended')return'';const b=S.beat;return`<aside class="news-strip" aria-label="Current economic news"><span class="news-tag">NEWS · Y${b.year} C${b.act}</span><span class="news-text" title="${escapeHtml(b.title+'. '+b.text)}"><b>${escapeHtml(b.title)}.</b> <span>${escapeHtml(b.text)}</span></span><button type="button" class="btn subtle smallbtn" onclick="UI.reopenNews()">Read more</button></aside>`}
function groupTabs(cur){return`<div class="tabs group-tabs" role="tablist" aria-label="Investment groups">${GROUPS.map(([g,label])=>{const open=groupOpen(g),on=g===cur;return`<button type="button" role="tab" id="gt-${g}" aria-selected="${on}" aria-controls="market-panel" class="${on?'on':''}" ${open?'':'disabled'} onclick="UI.group('${g}')">${label}${S.phase==='explore'&&(g==='banking'||g==='funds')?'<span class="hint-mark" aria-hidden="true">!</span>':''}${open?'':` <span class="tab-note">Year ${groupFirstYear(g)}</span>`}${groupIsNew(g)?' <span class="new-badge">NEW</span>':''}</button>`}).join('')}</div>`}
function holdingsPanel(t){return`<details class="panel compact portfolio-inline"><summary><b>My holdings</b> · ${Object.keys(t.hold).length} investments · Unrealised ${pNum(holdingsValue(S,t)-costBasis(t))}</summary>${holdings(t)}</details>`}
function groupGuide(g){
 const p=(title,txt)=>`<div class="intro-card"><b>${title}</b><span>${ag(txt)}</span></div>`;
 let content='';
 if(g==='banking')content=`<p class="small muted">Both products earn interest. Compare access to your money.</p><div class="intro-grid">${p('Savings account',`Earn ${S.savingsRate}% a year. You can withdraw during trading; interest compounds over time.`)}${p('Fixed-term deposit',`Earn a fixed interest rate of ${S.termRates.short}% for 1 year or ${S.termRates.long}% for 3 years. Your money stays locked until maturity.`)}</div>`;
 if(g==='funds')content=`<p class="small muted">Buy bonds or diversified funds. They may earn income and change in price.</p><div class="intro-grid">${p('Government bonds','You lend to a government. Receive coupons, but bond prices can still fall, particularly if interest rates rise.')}${p('Australian ETF','One fund owns many Australian shares. It spreads company-specific risk but can still lose value.')}${yearsNow(S)>=5?p('International ETF','Owns overseas shares and helps spread risk across different countries and economies.')+p('Property fund','Owns buildings and may earn income from rent. Property prices and borrowing costs can change.') : ''}</div>`;
 if(g==='shares')content=`<p class="small muted">A share represents part-ownership of one business. Profits, costs and unexpected news can change its price.</p>${introBody('shares')}`;
 if(g==='commodities')content=introBody('commod');
 return`<details class="panel compact group-guide"><summary>How do ${g==='banking'?'savings and deposits':g==='funds'?'funds and bonds':g==='shares'?'company shares':'commodities'} work?</summary>${content}</details>`;
}
function v55PortfolioBanner(t){const v=holdingsValue(S,t),gain=round(v-costBasis(t));return`<div class="portfolio-banner"><span><b>My investments</b> ${fm(v)}</span><span><b>Unrealised gain/loss</b> ${pNum(gain)}</span><span><b>Assets owned</b> ${Object.keys(t.hold).length}</span><button class="btn subtle smallbtn" onclick="UI.studentTab('performance')">View performance</button></div>`}
function invest(t){const g=curGroup();ensureSelected(g);
 const overview=`${v55PortfolioBanner(t)}${holdingsPanel(t)}${groupTabs(g)}${groupGuide(g)}`;
 if(g==='banking')return`${newsStrip()}${overview}<div id="market-panel" role="tabpanel" aria-labelledby="gt-${g}">${savings(t)}</div>`;
 return`${newsStrip()}${overview}<div class="market-layout main-market-layout"><div class="market-list"><div id="market-panel" role="tabpanel" aria-labelledby="gt-${g}"><div class="tile-grid">${groupAssets(g).map(a=>assetTile(a,t)).join('')}</div></div></div>${tradePanel(t)}</div>`;
}
function v54Finance(t){const unreal=round(holdingsValue(S,t)-costBasis(t)),real=round(t.realised||0),investmentIncome=round((t.divPaid||0)+(t.accrued||0)),bankInterest=round(t.interestPaid||0);return {unreal,real,investmentIncome,bankInterest,financial:round(unreal+real+investmentIncome+bankInterest),wages:round(t.incomeReceived||0),superContrib:round(t.superContrib||0),superEarned:round(t.superEarned||0),superBalance:round(t.superBalance||0),netWorth:totalNet(S,t)}}
function v54Snapshot(st,t){const unreal=round(holdingsValue(st,t)-sum(Object.values(t.hold),h=>h.cost));const real=round(t.realised||0),investIncome=round((t.divPaid||0)+(t.accrued||0)),interest=round(t.interestPaid||0);return {unreal,real,investIncome,interest,financial:round(unreal+real+investIncome+interest),wages:round(t.incomeReceived||0),superContrib:round(t.superContrib||0),superEarned:round(t.superEarned||0),superBalance:round(t.superBalance||0),netWorth:totalNet(st,t)}}
function v54Metric(label,amount,hint){return `<div class="metric"><div class="metric-label">${label}</div><div class="metric-num">${pNum(amount)}</div><div class="metric-sub">${hint}</div></div>`}
function v54Explain(t){const f=v54Finance(t),first=Object.keys(t.hold)[0],h=first?t.hold[first]:null,a=first?AS(first):null;return `<section class="panel"><h2>How financial returns are calculated</h2><p class="small muted">The figures use your actual holdings where possible. If no holding exists, an example is explicitly labelled as practice.</p>${h?`<details class="calc"><summary>View calculation: ${escapeHtml(a.name)} capital gain/loss</summary><p>${h.qty} units × ${fm(assetPrice(S,first))} current price = ${fm(h.qty*assetPrice(S,first))} market value.</p><p>${fm(h.qty*assetPrice(S,first))} − ${fm(h.cost)} remaining purchase cost = <strong>${pNum(round(h.qty*assetPrice(S,first)-h.cost))}</strong>.</p><p class="small muted">This is an unrealised gain/loss until the units are sold. This calculation uses your actual remaining cost basis.</p></details>`:`<details class="calc"><summary>View calculation: share gain (practice example)</summary><p>10 shares bought at $30 = $300 original cost. Now 10 × $36 = $360.</p><p>Capital gain = $360 − $300 = <strong>$60</strong>.</p></details>`}<details class="calc"><summary>View calculation: total financial gain/loss</summary><p>Realised gain/loss ${pNum(f.real)} + unrealised gain/loss ${pNum(f.unreal)} + dividends and coupons ${fm(f.investmentIncome)} + savings interest ${fm(f.bankInterest)} = <strong>${pNum(f.financial)}</strong>.</p><p class="small muted">The above excludes wages, quiz bonuses and employer superannuation contributions. Investment income already paid is not counted twice.</p></details><details class="calc"><summary>View calculation: dividend income (practice example)</summary><p>If 20 shares pay a $0.50 dividend each, income = 20 × $0.50 = <strong>$10</strong>.</p></details><details class="calc"><summary>View calculation: annual compound interest (practice example)</summary><p>$1,000 at 5% annual interest becomes $1,050 after one year and $1,102.50 after two years.</p><p>Interest earned = $1,102.50 − $1,000 = <strong>$102.50</strong>.</p><p class="small muted">In this simulation, annual rates are applied over three economic cycles. Your investigation may require monthly compounding instead.</p></details></section>`}
function v54Performance(t){const f=v54Finance(t);return`<section class="panel performance-top"><h2>Investment Performance Tracker</h2><p class="financial-note small">Wages (${fm(f.wages)}) are not investment profit. The results below exclude wages and employer super contributions.</p><div class="report-overview">${v54Metric('Capital gain/loss',round(f.real+f.unreal),'Sold + currently held')}${v54Metric('Dividends & bond coupons',f.investmentIncome,'Paid + accrued')}${v54Metric('Bank interest',f.bankInterest,'Savings + fixed deposits')}${v54Metric('Financial gain/loss',f.financial,'Excludes wages and super')}${v54Metric('Super balance',f.superBalance,`Contributions ${fm(f.superContrib)} · growth ${pNum(f.superEarned)}`)}${v54Metric('Net worth',f.netWorth,'Includes wages and super')}</div></section>`}
const V54_Q={2:['Why might a savings account be more suitable than a sharemarket ETF for money needed next year?','Which product did you choose and why?'],5:['Among investments you currently hold, which has the largest unrealised gain or loss? Use a dollar figure from the evidence table.','How did you balance risk, diversification and access to money?'],10:['Which strategy would you recommend using your financial results as evidence?','Why might that strategy not suit someone with a different financial goal?']};
function v54Reflections(t){return `<section class="panel"><h2>Investment decision journal</h2><p class="small muted">Your answers are stored in this local game save. Each response is ungraded.</p>${[2,5,10].map(y=>`<details class="calc" ${S.phase==='review'&&yearsNow(S)===y?'open':''}><summary>Year ${y} reflection ${t.reflections?.[y]?'· saved':'· not yet recorded'}</summary>${(V54_Q[y]||[]).map((q,i)=>`<label for="reflect-${y}-${i}">${i+1}. ${q}</label><textarea id="reflect-${y}-${i}" rows="3" ${!t.reflections?.[y]?'disabled':''}>${escapeHtml(t.reflections?.[y]?.[i]||'')}</textarea>`).join('')}<button class="btn primary" ${!t.reflections?.[y]?'disabled':''} onclick="UI.saveReflection(${y})">${t.reflections?.[y]?'Update saved reflections':'Complete at checkpoint'}</button></details>`).join('')}</section>`}
function v54FinalReport(t){const f=v54Finance(t),first=Object.entries(t.hold).map(([id,h])=>({id,profit:round(h.qty*assetPrice(S,id)-h.cost)})),best=first.slice().sort((a,b)=>b.profit-a.profit)[0],worst=first.slice().sort((a,b)=>a.profit-b.profit)[0];return `<section class="panel" id="final-report"><h2>Final 10-year investment report</h2>${v55Suitability(t)}<div class="report-stamp">Risk & Reward · Year 9 Economics · simulated money in AUD · seed ${S.seed}</div><p>Starting cash: <strong>${fm(S.startCash)}</strong> · Employment income: <strong>${fm(f.wages)}</strong> · Financial gain/loss: <strong>${pNum(f.financial)}</strong> · Final net worth: <strong>${fm(f.netWorth)}</strong>.</p><p>Capital gain/loss ${pNum(round(f.real+f.unreal))} · Investment payouts ${fm(f.investmentIncome)} · Bank interest ${fm(f.bankInterest)} · Employer super contributions ${fm(f.superContrib)} · Super investment growth/loss ${pNum(f.superEarned)}.</p>${best?`<p>Largest unrealised dollar gain among <em>currently held</em> investments: ${escapeHtml(AS(best.id).name)} (${pNum(best.profit)}). Lowest among currently held investments: ${escapeHtml(AS(worst.id).name)} (${pNum(worst.profit)}). These are dollar amounts and do not measure percentage performance or include previously sold holdings.</p>`:'<p>No current share or fund holdings to compare.</p>'}<p class="small muted">Net worth reflects cash, savings, market assets and super, including wages and bonuses. Net-worth growth is not the same as investment profit.</p><div class="review-cta"><button class="btn primary" onclick="UI.reportPreview()">Export investment report (PDF)</button><button class="btn" onclick="UI.export()">Export game data</button></div></section>`}

const GLOSS={interest:['Interest','Money you earn for lending your money (for example to a bank), or pay when you borrow.'],
compound:['Compound interest','Interest earned on your original money and on the interest you have already earned, so growth speeds up over time.'],
fixed:['Fixed interest rate','A rate locked in for a set period. It stays the same even if market interest rates change.'],
principal:['Principal','The original amount you deposit or invest, before any interest or gains.'],
maturity:['Maturity date','The day a fixed-term deposit ends and you get your money and interest back.'],
liquidity:['Liquidity','How quickly you can turn something into cash without losing value. Savings are very liquid; property is not.'],
etf:['ETF','Exchange-traded fund: one investment that holds many shares or bonds, so you own a small slice of lots of assets.'],
diversification:['Diversification','Spreading your money across different investments so one bad result hurts less.'],
shareholder:['Shareholder','A part-owner of a company. You own shares and may receive a share of its profits.'],
growth:['Capital growth','An increase in an investment’s price above what you paid for it.'],
loss:['Capital loss','When an investment’s price falls below what you paid. It becomes a realised loss only if you sell.'],
dividend:['Dividend','A share of a company’s profit paid to its shareholders, usually in cash.'],
yield:['Yield','The income an investment pays each year (such as interest or dividends) as a percentage of its price.'],
volatility:['Volatility','How much and how quickly a price moves up and down. High volatility means bigger swings.'],
risktol:['Risk tolerance','How much ups and downs in your investments you can handle, both financially and emotionally.'],
commodity:['Commodity','A raw material that is bought and sold, such as gold, copper or oil.'],
super:['Superannuation','Australia’s retirement savings system. Money is set aside while you work and is locked away until you retire.'],
horizon:['Time horizon','How long until you need the money. Longer horizons can usually handle more risk.']};
const GALIAS=[['compound interest','compound'],['fixed interest rate','fixed'],['fixed rate','fixed'],['maturity date','maturity'],['capital growth','growth'],['capital gains','growth'],['capital gain','growth'],['capital losses','loss'],['capital loss','loss'],['risk tolerance','risktol'],['superannuation','super'],['diversification','diversification'],['diversified','diversification'],['shareholders','shareholder'],['shareholder','shareholder'],['dividends','dividend'],['dividend','dividend'],['volatility','volatility'],['volatile','volatility'],['liquidity','liquidity'],['principal','principal'],['commodities','commodity'],['commodity','commodity'],['interest','interest'],['yield','yield'],['ETFs','etf'],['ETF','etf'],['time horizon','horizon']].sort((a,b)=>b[0].length-a[0].length);
const GRE=new RegExp('\\b('+GALIAS.map(a=>a[0]).join('|')+')\\b','gi'),GMAP=Object.fromEntries(GALIAS.map(a=>[a[0].toLowerCase(),a[1]]));
function ag(text){const seen={};return escapeHtml(text).replace(GRE,m=>{const k=GMAP[m.toLowerCase()];if(!k||seen[k])return m;seen[k]=1;return`<button type="button" class="term" data-term="${k}" aria-expanded="false">${m}</button>`})}
const gp={btn:null,pinned:false};
function dedupeTerms(root){if(!root)return;const seen=new Set();root.querySelectorAll('.term').forEach(b=>{if(!b.getClientRects().length)return;const key=b.dataset.term;if(seen.has(key))b.replaceWith(document.createTextNode(b.textContent));else seen.add(key)})}
function glossEl(){let e=document.getElementById('gloss-pop');if(!e){e=document.createElement('div');e.id='gloss-pop';e.setAttribute('role','tooltip');e.hidden=true;document.body.appendChild(e)}return e}
function showGloss(b,pin){const g=GLOSS[b.dataset.term];if(!g)return;if(gp.btn&&gp.btn!==b)gp.btn.setAttribute('aria-expanded','false');const e=glossEl();e.innerHTML=`<b>${escapeHtml(g[0])}</b><br>${escapeHtml(g[1])}`;e.hidden=false;const r=b.getBoundingClientRect(),w=e.offsetWidth,h=e.offsetHeight;let x=Math.max(8,Math.min(r.left,innerWidth-w-8)),y=r.bottom+6;if(y+h>innerHeight-8)y=Math.max(8,r.top-h-6);e.style.left=x+'px';e.style.top=y+'px';b.setAttribute('aria-describedby','gloss-pop');b.setAttribute('aria-expanded','true');gp.btn=b;gp.pinned=!!pin}
function hideGloss(force){if(!force&&gp.pinned)return;const e=document.getElementById('gloss-pop');if(e)e.hidden=true;if(gp.btn){gp.btn.removeAttribute('aria-describedby');gp.btn.setAttribute('aria-expanded','false')}gp.btn=null;gp.pinned=false}
const termOf=e=>e.target&&e.target.closest?e.target.closest('.term'):null;
document.addEventListener('mouseover',e=>{const b=termOf(e);if(b&&!gp.pinned)showGloss(b,false)});
document.addEventListener('mouseout',e=>{if(termOf(e)&&!gp.pinned)hideGloss(true)});
document.addEventListener('focusin',e=>{const b=termOf(e);if(b&&!gp.pinned)showGloss(b,false)});
document.addEventListener('focusout',e=>{if(termOf(e)&&!gp.pinned)hideGloss(true)});
document.addEventListener('click',e=>{const b=termOf(e);if(b){e.preventDefault();if(gp.pinned&&gp.btn===b)hideGloss(true);else showGloss(b,true);return}if(!e.target.closest('#gloss-pop'))hideGloss(true)});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&gp.btn)hideGloss(true)});

 return''}

priceForNews=function(state,beat){const moves={};state.v6Factors=state.v6Factors||{};const factors=state.v6Factors[state.cycle]||{};A.forEach(a=>{const effect=newsImpact(a,beat),old=state.prices[a.id].at(-1),newP=round(Math.max(.5,old*Math.exp(.30*effect)));state.prices[a.id].push(newP);moves[a.id]=round(100*(newP/old-1));factors[a.id]={news:effect*100,pre:.30*effect*100,post:.70*effect*100,random:0}});state.v6Factors[state.cycle]=factors;return moves};

 const chart=panel?.querySelector('.v60-chart-panel');
 if(!layout||!panel||!chart)return html;
 // The old V5.9 purchase-reason selector is no longer shown in trading.
 panel.querySelector('.v59-reason')?.remove();
 const a=AS(S.ui.selected);
 const level=a.sig<=10?'Very low':a.sig<=20?'Moderate':a.sig<=30?'High':a.sig<=40?'Very high':'Extreme';
 const cls=level==='Very low'?'swing-vlow':level==='Moderate'?'swing-mod':level==='High'?'swing-high':level==='Very high'?'swing-vhigh':'swing-extreme';
 const col=document.createElement('section');
 col.className='v6-chart-column';
 col.setAttribute('aria-label','Price graph and volatility');
 col.innerHTML='<div class="v6-chart-label"><span class="swing-pill '+cls+'" title="'+a.sig+'% modelled annual volatility is not a maximum possible loss">Price swings: '+level+'</span><small>Price history and volatility</small></div>';
 col.appendChild(chart);
 const metrics=panel.querySelector('.v6-asset-metrics');
 if(metrics&&metrics.children.length>=3)metrics.lastElementChild.remove();
 layout.classList.add('v6-three-col');
 layout.insertBefore(col,panel);
 return wrap.innerHTML;
};

// The first-cycle reason is a short review question, not a condition for buying.
const reasons=[
 ['growth','I expected an investment to rise in price'],
 ['income','I wanted to earn interest, coupons or dividends'],
 ['spread','I wanted to spread investment risk'],
 ['stability','I preferred lower risk or access to cash'],
 ['news','The economic news influenced my decision'],
 ['wait','I decided to keep my cash and wait']
];
const previousResults=resultsOverlay;
resultsOverlay=function(t){
 let html=previousResults(t);
 if(PART!==1||S.cycle!==0||!t.last||t.last.year!==1||t.last.cycle!==1)return html;
 const selected=t.v6FirstCycleReason||'';
 const options=reasons.map(([value,label])=>'<option value="'+value+'" '+(selected===value?'selected':'')+'>'+label+'</option>').join('');
 const prompt='<section class="v6-cycle-reflection"><label for="v6-first-reason">Your first decision: what influenced your saving or investing choice?</label><select id="v6-first-reason" onchange="UI.v6FirstCycleReason(this.value)"><option value="">Choose one reason...</option>'+options+'</select><p class="v6-reflection-hint">Think about the choice you made during trading, even if you kept your money in cash.</p></section>';
 return html.replace('<div class="v59-hero">',prompt+'<div class="v59-hero">');
};
UI.v6FirstCycleReason=function(reason){
 if(!reasons.some(x=>x[0]===reason))return;
 const t=findTeam();
 t.v6FirstCycleReason=reason;
 t.yearNotes=t.yearNotes||{};
 if(!t.yearNotes[1])t.yearNotes[1]=reasons.find(x=>x[0]===reason)[1];
 save();
};
const nextCycleBeforeReason=UI.nextCycle;
UI.nextCycle=function(){
 if(PART===1&&S.phase==='review'&&S.cycle===0&&!findTeam().v6FirstCycleReason){
   toast('Choose one reason for your first-cycle decision before continuing.',true);
   return;
 }
 return nextCycleBeforeReason.call(this);
};
})();
